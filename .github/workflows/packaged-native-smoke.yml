name: Packaged desktop native smoke

# Report-only Windows runtime evidence. This workflow is deliberately separate
# from CI, deploy, installer permissions, serial devices, and hardware release qualification.
on:
  schedule:
    - cron: '19 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native-smoke:
    name: Windows packaged launch/import/save
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and Electron main
        run: pnpm build:web && pnpm build:electron-main

      - name: Package disposable unpacked Preview
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win --x64 --dir --config electron-builder.preview.yml --publish never

      - name: Run isolated packaged native smoke
        id: native_smoke
        shell: pwsh
        run: |
          $executable = (Resolve-Path 'release/0.1.0/win-unpacked/KerfDesk.exe').Path
          pnpm smoke:desktop:native -- $executable

      - name: Record SHA-correlated readiness lanes
        if: always()
        run: >-
          pnpm report:release-readiness
          --state=ci=not-run
          --state=browser=not-run
          --state=deploy=not-run
          --state=packaged-runtime=${{ steps.native_smoke.outcome }}
          --state=perceptual-reference-cam=not-run
          --state=hardware=not-run

      - name: Upload native smoke and readiness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-native-smoke-${{ github.sha }}
          path: |
            artifacts/native-smoke/
            artifacts/release-readiness/
          if-no-files-found: warn
          retention-days: 30
