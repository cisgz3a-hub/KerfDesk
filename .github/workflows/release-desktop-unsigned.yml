name: Release unsigned Windows desktop

on:
  workflow_run:
    workflows: [CI, Browser smoke, Desktop package check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_now:
        description: Release now before 10 merged PRs (all checks and trust guards still apply)
        type: boolean
        default: false

# This lane is the sole automatic writer of commercial-manual/latest.json.
concurrency:
  group: kerfdesk-commercial-manual-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  qualify:
    if: >-
      vars.KERFDESK_UNSIGNED_RELEASES == 'on' && github.repository == 'cisgz3a-hub/KerfDesk' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      source-sha: ${{ steps.gate.outputs.sourceSha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Require exact main checks and 10 merged PRs or explicit release now
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KERFDESK_RELEASE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.release_now }}
        run: node scripts/unsigned-release-plan.mjs gate

  publish:
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    environment: desktop-commercial
    env:
      KERFDESK_TEST_BROWSER: chromium
    # Set only after Windows is published: the macOS and Linux jobs follow it
    # with the same version and signed release identity (ADR-613).
    outputs:
      published: ${{ steps.share.outputs.published }}
      version: ${{ steps.plan.outputs.version }}
      source-sha: ${{ steps.plan.outputs.sourceSha }}
      identity: ${{ steps.share.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.qualify.outputs.source-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Plan a new immutable version from the verified public release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KERFDESK_RELEASE_NOW: ${{ github.event_name == 'workflow_dispatch' && inputs.release_now }}
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot refresh main.' }
          node scripts/unsigned-release-plan.mjs plan
          if ($LASTEXITCODE -ne 0) { throw 'Cannot plan an authenticated release.' }
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: steps.plan.outputs.publish == 'true'
      - name: Fetch the Electron zip with retries
        if: steps.plan.outputs.publish == 'true' && hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'
          cache: 'false'
      - name: Install the locked dependency graph
        if: steps.plan.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install the matching public-delivery browser
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          pnpm exec playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Public delivery browser installation failed.' }
          node scripts/public-delivery-browser.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Public delivery browser startup failed.' }
      - name: Require current packaged-runtime advisory evidence
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_SOURCE_SHA: ${{ steps.plan.outputs.sourceSha }}
        shell: bash
        run: |
          audit_dir="${RUNNER_TEMP}/unsigned-dependency-audit"
          mkdir -p "${audit_dir}"
          set +e
          pnpm audit --json > "${audit_dir}/full.json"
          full_exit=$?
          pnpm audit --prod --json > "${audit_dir}/runtime.json"
          runtime_exit=$?
          set -e
          pnpm report:dependency-audit \
            --full="${audit_dir}/full.json" --runtime="${audit_dir}/runtime.json" \
            --full-exit="${full_exit}" --runtime-exit="${runtime_exit}" --output="${audit_dir}"
          node --input-type=module -e '
            import fs from "node:fs";
            import { createHash } from "node:crypto";
            const file = process.argv[1];
            const report = JSON.parse(fs.readFileSync(file, "utf8"));
            Object.assign(report, {
              sourceSha: process.env.RELEASE_SOURCE_SHA,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: process.env.GITHUB_RUN_ATTEMPT,
              lockfileSha256: createHash("sha256").update(fs.readFileSync("pnpm-lock.yaml")).digest("hex")
            });
            fs.writeFileSync(file, JSON.stringify(report, null, 2) + "\n");
          ' "${audit_dir}/report.json"
          cat "${audit_dir}/report.md" >> "${GITHUB_STEP_SUMMARY}"
          runtime_count=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).runtimeCount" "${audit_dir}/report.json")
          test "${runtime_count}" = '0'
      - name: Build the desktop source that passed the required checks
        if: steps.plan.outputs.publish == 'true'
        env:
          KERFDESK_DESKTOP_VERSION: ${{ steps.plan.outputs.version }}
        shell: pwsh
        run: |
          pnpm guard:repo
          if ($LASTEXITCODE -ne 0) { throw 'Repository check failed.' }
          pnpm generate:notices
          if ($LASTEXITCODE -ne 0) { throw 'Notice generation failed.' }
          pnpm build:electron-main
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed.' }
          pnpm build:bundle:desktop
          if ($LASTEXITCODE -ne 0) { throw 'Desktop renderer build failed.' }
      - name: Prepare the production licence identity and unsigned installer
        if: steps.plan.outputs.publish == 'true'
        env:
          DESKTOP_STABLE_MANIFEST_PRIVATE_KEY: ${{ secrets.DESKTOP_STABLE_MANIFEST_PRIVATE_KEY }}
          RELEASE_KEY_ID: ${{ vars.DESKTOP_STABLE_MANIFEST_KEY_ID }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_SHA: ${{ steps.plan.outputs.sourceSha }}
          RELEASE_TIME: ${{ steps.plan.outputs.publishedAt }}
        shell: pwsh
        run: |
          $preparation = Join-Path $env:RUNNER_TEMP 'commercial-preparation'
          $terms = Join-Path $env:RUNNER_TEMP 'kerfdesk-installer-terms.txt'
          Copy-Item -LiteralPath public/eula.txt -Destination $terms
          node scripts/prepare-commercial-desktop.mjs --unsigned-installer `
            --output-dir $preparation --terms-file $terms --version $env:RELEASE_VERSION `
            --source-sha $env:RELEASE_SHA --source-ref refs/heads/main `
            --published-at $env:RELEASE_TIME --key-id $env:RELEASE_KEY_ID
          if ($LASTEXITCODE -ne 0) { throw 'Production licence preparation failed.' }
      - name: Package the verified unsigned Windows installer
        if: steps.plan.outputs.publish == 'true'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'commercial-preparation/electron-builder.commercial-unsigned.generated.json'
          pnpm exec electron-builder --config $config --win --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed.' }
      - name: Install, launch and uninstall the production Windows candidate
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_SHA: ${{ steps.plan.outputs.sourceSha }}
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "release/commercial-unsigned/$env:RELEASE_VERSION"
          $installer = Join-Path $release "KerfDesk-$env:RELEASE_VERSION-windows-x64-setup.exe"
          & ./scripts/qualify-windows-installer.ps1 -Scenario Launch -PackageKind CommercialUnsigned `
            -Installer $installer -Version $env:RELEASE_VERSION -SourceCommit $env:RELEASE_SHA `
            -EvidenceRoot (Join-Path $release 'installer-qualification')
      - name: Verify packaged security and refuse a modified application archive
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "release/commercial-unsigned/$env:RELEASE_VERSION"
          $executable = Join-Path $release 'win-unpacked/KerfDesk.exe'
          $archive = Join-Path $release 'win-unpacked/resources/app.asar'
          $evidence = Join-Path $release 'installer-qualification'
          node scripts/verify-packaged-desktop.mjs $executable $archive electron-builder.yml 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'packaged-security.txt')
          if ($LASTEXITCODE -ne 0) { throw 'Packaged fuse or runtime closure verification failed.' }
          $before = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          # The unlicensed commercial baseline opens behind its licence window (ADR-623),
          # or in KerfDesk Free while Amendment 3 holds it off: the probe reads that setting.
          node scripts/verify-asar-integrity-enforced.mjs $executable $archive "--output=$evidence/asar-probe" --expect-licence-window 2>&1 |
            Tee-Object -FilePath (Join-Path $evidence 'asar-integrity.txt')
          $integrityExit = $LASTEXITCODE
          $after = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          @{ beforeSha256 = $before; afterSha256 = $after; exitCode = $integrityExit } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'asar-restoration.json')
          if ($before -ne $after) { throw 'The integrity probe did not restore the candidate archive.' }
          if ($integrityExit -ne 0) { throw 'The candidate did not prove ASAR tamper refusal.' }
      - name: Require retained projects and profile when upgrading from the published version
        if: steps.plan.outputs.publish == 'true' && steps.plan.outputs.previousVersion != ''
        env:
          PREVIOUS_RELEASE_VERSION: ${{ steps.plan.outputs.previousVersion }}
          PREVIOUS_RELEASE_SHA: ${{ steps.plan.outputs.previousSourceSha }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_SHA: ${{ steps.plan.outputs.sourceSha }}
          # Opens a build behind the licence window, then releases the seat (ADR-623).
          # Unused while ADR-623 Amendment 3 holds the window off: every build opens in Free.
          KERFDESK_NATIVE_QUALIFICATION_LICENCE: ${{ secrets.KERFDESK_NATIVE_QUALIFICATION_LICENCE }}
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/historical-installers'
          node scripts/published-upgrade-installers.mjs $env:PREVIOUS_RELEASE_VERSION $root
          if ($LASTEXITCODE -ne 0) { throw 'Published upgrade baseline was not authenticated.' }
          $previous = Get-Content -LiteralPath (Join-Path $root "$env:PREVIOUS_RELEASE_VERSION/public-release.json") -Raw | ConvertFrom-Json
          if ($previous.manifest.sourceSha -ne $env:PREVIOUS_RELEASE_SHA) { throw 'Published baseline differs from the planned source.' }
          $release = Join-Path $env:GITHUB_WORKSPACE "release/commercial-unsigned/$env:RELEASE_VERSION"
          $installer = Join-Path $release "KerfDesk-$env:RELEASE_VERSION-windows-x64-setup.exe"
          & ./scripts/qualify-windows-installer.ps1 -Scenario HistoricalUpgrade -PackageKind CommercialUnsigned `
            -Installer $previous.installer -Version $previous.manifest.version -SourceCommit $previous.manifest.sourceSha `
            -UpgradeInstaller $installer -UpgradeVersion $env:RELEASE_VERSION -UpgradeSourceCommit $env:RELEASE_SHA `
            -EvidenceRoot (Join-Path $env:GITHUB_WORKSPACE 'artifacts/installed-qualification/historical-upgrade')
          "Native upgrade from $env:PREVIOUS_RELEASE_VERSION retained the saved project, preferences, machine profile and licence state." >> $env:GITHUB_STEP_SUMMARY
      - name: Retain installed Windows qualification evidence
        if: always() && steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-installer-qualification-${{ steps.plan.outputs.version }}-${{ github.run_attempt }}
          path: |
            release/commercial-unsigned/${{ steps.plan.outputs.version }}/installer-qualification/
            artifacts/installed-qualification/
            artifacts/historical-installers/*/public-release.json
            artifacts/historical-installers/*/download-manifest.json
            artifacts/historical-installers/*/archive-*.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Verify delivery browser is available before publication
        if: steps.plan.outputs.publish == 'true'
        run: node scripts/public-delivery-browser.mjs
      - name: Publish immutable installer, verified history and notification manifest
        id: publish-windows
        if: steps.plan.outputs.publish == 'true'
        env:
          DESKTOP_STABLE_MANIFEST_PRIVATE_KEY: ${{ secrets.DESKTOP_STABLE_MANIFEST_PRIVATE_KEY }}
          DESKTOP_STABLE_MANIFEST_KEY_ID: ${{ vars.DESKTOP_STABLE_MANIFEST_KEY_ID }}
          COMMERCIAL_R2_API_TOKEN: ${{ secrets.COMMERCIAL_R2_API_TOKEN }}
          COMMERCIAL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.COMMERCIAL_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          EXPECTED_LATEST_SHA256: ${{ steps.plan.outputs.expectedLatestSha256 }}
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw 'Cannot refresh publication ancestry.' }
          $identity = Join-Path $env:RUNNER_TEMP 'commercial-preparation/commercial-release-identity.json'
          $release = "release/commercial-unsigned/$env:RELEASE_VERSION"
          $historyArguments = @()
          $historyPath = 'docs/releases/manual-download-history.json'
          if (Test-Path -LiteralPath $historyPath) {
            $historyArguments = @('--reviewed-history', $historyPath)
          }
          node scripts/publish-manual-commercial-release.mjs @historyArguments `
            --expected-latest-sha256 $env:EXPECTED_LATEST_SHA256 $release $identity "$release/win-unpacked/resources"
          if ($LASTEXITCODE -ne 0) { throw 'Unsigned publication was not confirmed.' }
          "Published Windows $env:RELEASE_VERSION with verified download history. Installed apps check at startup and every 30 minutes; download and installation require user choices." >> $env:GITHUB_STEP_SUMMARY
      - name: Hand the published release identity to the macOS and Linux builds
        id: share
        if: steps.plan.outputs.publish == 'true' && steps.publish-windows.outcome == 'success'
        shell: pwsh
        run: |
          # Capture confirmed publication before the later delivery/receipt checks.
          # Their failure still fails the Windows job, but cannot undo this release.
          # Public signed data, embedded in every installer; the key stays here.
          $identity = Join-Path $env:RUNNER_TEMP 'commercial-preparation/commercial-release-identity.json'
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($identity))
          "identity=$encoded" >> $env:GITHUB_OUTPUT
          'published=true' >> $env:GITHUB_OUTPUT
      - name: Verify customer delivery through the public CDN and download page
        if: steps.plan.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_SHA: ${{ steps.plan.outputs.sourceSha }}
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'public-desktop-delivery'
          node scripts/verify-public-desktop-release.mjs --expected-version $env:RELEASE_VERSION `
            --expected-source-sha $env:RELEASE_SHA --output-dir $evidence --website
          if ($LASTEXITCODE -ne 0) { throw 'Published release requires public delivery investigation; do not roll back immutable files.' }
      - name: Archive a signed success receipt with the immutable release
        if: steps.plan.outputs.publish == 'true'
        env:
          DESKTOP_STABLE_MANIFEST_PRIVATE_KEY: ${{ secrets.DESKTOP_STABLE_MANIFEST_PRIVATE_KEY }}
          DESKTOP_STABLE_MANIFEST_KEY_ID: ${{ vars.DESKTOP_STABLE_MANIFEST_KEY_ID }}
          COMMERCIAL_R2_API_TOKEN: ${{ secrets.COMMERCIAL_R2_API_TOKEN }}
          COMMERCIAL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.COMMERCIAL_CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_SOURCE_SHA: ${{ steps.plan.outputs.sourceSha }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.plan.outputs.previousVersion }}
        shell: pwsh
        run: |
          $release = Join-Path $env:GITHUB_WORKSPACE "release/commercial-unsigned/$env:RELEASE_VERSION"
          $qualification = Join-Path $release 'installer-qualification'
          $baseline = @('--first-release')
          if ($env:PREVIOUS_VERSION) {
            $baseline = @('--upgrade', (Join-Path $env:GITHUB_WORKSPACE 'artifacts/installed-qualification/historical-upgrade/qualification.json'),
              '--previous-manifest', (Join-Path $env:GITHUB_WORKSPACE "artifacts/historical-installers/$env:PREVIOUS_VERSION/download-manifest.json"))
          }
          node scripts/publish-desktop-release-receipt.mjs @baseline `
            --identity (Join-Path $env:RUNNER_TEMP 'commercial-preparation/commercial-release-identity.json') `
            --installer (Join-Path $release "KerfDesk-$env:RELEASE_VERSION-windows-x64-setup.exe") `
            --launch (Join-Path $qualification 'qualification.json') `
            --asar-restoration (Join-Path $qualification 'asar-restoration.json') `
            --dependency-audit (Join-Path $env:RUNNER_TEMP 'unsigned-dependency-audit/report.json') `
            --public-delivery (Join-Path $env:RUNNER_TEMP 'public-desktop-delivery/public-delivery.json')
          if ($LASTEXITCODE -ne 0) { throw 'Release is published but its durable success receipt needs recovery from retained evidence.' }
      - name: Retain dependency and public delivery evidence for every attempted publication
        if: always() && steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-delivery-${{ steps.plan.outputs.version }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/unsigned-dependency-audit/report.*
            ${{ runner.temp }}/public-desktop-delivery/
            ${{ runner.temp }}/commercial-preparation/commercial-release-identity.json
          retention-days: 90
          if-no-files-found: error
      - name: Preserve a failed release for inspection
        if: failure() && steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-release-${{ steps.plan.outputs.version }}-${{ github.run_attempt }}
          path: |
            release/commercial-unsigned/${{ steps.plan.outputs.version }}/*.exe
            ${{ runner.temp }}/commercial-preparation/commercial-release-identity.json
            ${{ runner.temp }}/unsigned-native-smoke/**
            ${{ runner.temp }}/unsigned-dependency-audit/report.*
          retention-days: 90
          if-no-files-found: warn

  # macOS and Linux follow the published Windows release (ADR-613). Each system
  # is off until its repository variable is `on`. The build jobs hold no
  # secret: they reuse the identity the Windows job signed. A failure here never
  # changes the Windows release; re-running the failed jobs repeats this version.
  # Explicit status checks let a confirmed Windows publication hand off even if
  # its subsequent public-delivery check or success-receipt upload fails.
  # Those checks still fail the workflow; cancellation still stops companion work.
  build-macos-arm64:
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.published == 'true' &&
      vars.KERFDESK_UNSIGNED_MACOS_RELEASES == 'on'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps: &commercial-build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.source-sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Fetch the Electron zip with retries
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'
          cache: 'false'
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Build the desktop source the Windows release was built from
        env:
          KERFDESK_DESKTOP_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          pnpm guard:repo
          pnpm generate:notices
          pnpm build:electron-main
          pnpm build:bundle:desktop
      - name: Package and qualify the unsigned commercial build
        id: build
        env:
          IDENTITY: ${{ needs.publish.outputs.identity }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          RELEASE_SHA: ${{ needs.publish.outputs.source-sha }}
        run: |
          identity="${RUNNER_TEMP}/published-release-identity.json"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.IDENTITY, "base64"))' "${identity}"
          platform="$(echo "${RUNNER_OS}" | tr "[:upper:]" "[:lower:]")"
          if [[ "${platform}" == macos ]]; then arch="$(echo "${RUNNER_ARCH}" | tr "[:upper:]" "[:lower:]")"; else arch=x64; fi
          bash scripts/build-commercial-platform.sh "${platform}" "${arch}" \
            "${RELEASE_VERSION}" "${RELEASE_SHA}" "${identity}"
      - name: Keep the qualified files for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # No attempt number: a re-run build replaces its files, and a re-run
          # publish job finds those its build qualified.
          name: commercial-files-${{ runner.os }}-${{ runner.arch }}-${{ needs.publish.outputs.version }}
          path: |
            release/commercial-unsigned/${{ needs.publish.outputs.version }}/*.dmg
            release/commercial-unsigned/${{ needs.publish.outputs.version }}/*.deb
            release/commercial-unsigned/${{ needs.publish.outputs.version }}/*.AppImage
          retention-days: 3
          overwrite: true
          if-no-files-found: error
      - name: Keep the launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: commercial-qualification-${{ runner.os }}-${{ runner.arch }}-${{ needs.publish.outputs.version }}-${{ github.run_attempt }}
          path: artifacts/native-smoke/
          retention-days: 7
          if-no-files-found: warn

  build-macos-x64:
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.published == 'true' &&
      vars.KERFDESK_UNSIGNED_MACOS_RELEASES == 'on'
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps: *commercial-build-steps

  build-linux:
    needs: publish
    if: >-
      !cancelled() && needs.publish.outputs.published == 'true' &&
      vars.KERFDESK_UNSIGNED_LINUX_RELEASES == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps: *commercial-build-steps

  publish-macos:
    needs: [publish, build-macos-arm64, build-macos-x64]
    if: >-
      !cancelled() && needs.publish.outputs.published == 'true' &&
      vars.KERFDESK_UNSIGNED_MACOS_RELEASES == 'on' &&
      needs.build-macos-arm64.result == 'success' && needs.build-macos-x64.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-commercial
    env:
      PLATFORM: macos
      QUALIFIED_OS: macOS
      DIGESTS: ${{ needs.build-macos-arm64.outputs.digests }} ${{ needs.build-macos-x64.outputs.digests }}
    steps: &commercial-publish-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.publish.outputs.source-sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Install the locked dependency graph
        run: pnpm install --frozen-lockfile
      - name: Collect the qualified files
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: commercial-files-${{ env.QUALIFIED_OS }}-*-${{ needs.publish.outputs.version }}
          path: ${{ runner.temp }}/qualified
          merge-multiple: true
      - name: Publish the files beside the Windows release, then the system's latest document
        env:
          DESKTOP_STABLE_MANIFEST_PRIVATE_KEY: ${{ secrets.DESKTOP_STABLE_MANIFEST_PRIVATE_KEY }}
          DESKTOP_STABLE_MANIFEST_KEY_ID: ${{ vars.DESKTOP_STABLE_MANIFEST_KEY_ID }}
          COMMERCIAL_R2_API_TOKEN: ${{ secrets.COMMERCIAL_R2_API_TOKEN }}
          COMMERCIAL_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.COMMERCIAL_CLOUDFLARE_ACCOUNT_ID }}
          IDENTITY: ${{ needs.publish.outputs.identity }}
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          git fetch --no-tags origin main
          identity="${RUNNER_TEMP}/published-release-identity.json"
          node -e 'require("fs").writeFileSync(process.argv[1], Buffer.from(process.env.IDENTITY, "base64"))' "${identity}"
          # Only the files whose SHA-256 the qualifying jobs reported.
          digests=()
          for pair in ${DIGESTS}; do digests+=(--sha256 "${pair}"); done
          node scripts/publish-platform-commercial-release.mjs --platform "${PLATFORM}" \
            "${digests[@]}" "${RUNNER_TEMP}/qualified" "${identity}"
          echo "Published ${PLATFORM} ${RELEASE_VERSION} beside Windows. Installed copies show it at startup and every 30 minutes and open the download page; nothing installs by itself." >> "${GITHUB_STEP_SUMMARY}"

  publish-linux:
    needs: [publish, build-linux]
    if: >-
      !cancelled() && needs.publish.outputs.published == 'true' &&
      vars.KERFDESK_UNSIGNED_LINUX_RELEASES == 'on' && needs.build-linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: desktop-commercial
    env:
      PLATFORM: linux
      QUALIFIED_OS: Linux
      DIGESTS: ${{ needs.build-linux.outputs.digests }}
    steps: *commercial-publish-steps
