name: Coverage trend

# Observability only: this scheduled/manual workflow is not a required check,
# and the report script enforces no coverage threshold.
on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Report coverage totals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect coverage
        run: pnpm test:coverage

      - name: Build trend report
        run: pnpm report:coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and trend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/
            artifacts/coverage-trend/
          retention-days: 30
