name: Coverage trend

# Observability only: this scheduled/manual workflow is not a required check,
# and the report script enforces no coverage threshold.
on:
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Report coverage totals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect coverage
        run: pnpm test:coverage

      - name: Build trend report
        run: pnpm report:coverage | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and trend artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.sha }}
          path: |
            coverage/
            artifacts/coverage-trend/
          retention-days: 30
