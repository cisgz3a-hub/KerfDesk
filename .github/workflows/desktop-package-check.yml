name: Desktop package check

# Packages the desktop app, checks what shipped, and launches it (ADR-483,
# ADR-522). Unit tests cannot see what electron-builder actually packs: its
# file patterns and fuse flips apply silently, and the release lanes' own
# package checks otherwise ran only when a release was tagged.
#
# - Linux packages the stable config as an unpacked app, on every pull request,
#   merge queue entry and push to main. A second Linux job builds the AppImage
#   and .deb from the Preview config, checks their package contract, installs
#   the .deb and launches the installed app with Ubuntu's default sandbox
#   restriction in place, then removes it (ADR-607). A third rehearses the
#   commercial Linux build of the unsigned lane, and macOS rehearses its
#   commercial build with the native jobs (ADR-613). A pull request that
#   changes only renderer, test or documentation source skips the installer
#   and commercial jobs; they report as skipped, which passes their required
#   checks, and every push to main still runs them (ADR-647).
# - Windows and macOS build the unsigned Preview exactly as the Preview release
#   lane does, and run that lane's package contract. Windows then installs it,
#   launches the installed app and uninstalls it; macOS launches the app from
#   inside its DMG. Both prove a modified app.asar stops the app. The repository
#   is private, so these runners bill at 2x and 10x Linux minutes: they run when
#   the release train calls this workflow or on a manual run, not on every pull
#   request (ADR-522 Amendment 1).
# - Every launch is the packaged native smoke: launch, SVG import, project
#   save, on a throwaway profile.
#
# Kept out of ci.yml so a desktop packaging failure never holds a web deploy.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued pull request on a gh-readonly-queue/main/...
  # branch and waits for the required checks this workflow reports (ADR-645).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      native:
        description: Also package, install and launch on Windows and macOS
        type: boolean
        default: true
  workflow_call:
    inputs:
      native:
        type: boolean
        default: true
      # The release train passes the commit it is about to release, which can
      # be older than the newest commit on main (ADR-541).
      ref:
        type: string
        default: ''

concurrency:
  # A fixed prefix: when the release train calls this workflow, github.workflow
  # names the caller, and sharing its group would deadlock the call. The train's
  # call is grouped by the commit it checks, so it never waits behind, or is
  # replaced by, a run for a push to main.
  group: desktop-package-check-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  desktop-packaging-gate:
    name: Desktop packaging gate
    if: always()
    needs:
      [
        packaging-scope,
        linux-package,
        linux-installers,
        commercial-linux,
        commercial-macos,
        windows-package,
        macos-package,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The verdict runs from this workflow's own revision, not the commit
      # being packaged: the release train may pass an older commit that
      # predates the gate script.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Require all selected packaging jobs to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          NATIVE_PACKAGING: ${{ inputs.native == true }}
          INSTALLER_PACKAGING: ${{ needs.packaging-scope.outputs.installers != 'false' }}
        run: node scripts/desktop-packaging-gate.mjs

  packaging-scope:
    name: Choose the packaging checks this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      installers: ${{ steps.scope.outputs.installers }}
    steps:
      # The scope script runs from this workflow's own revision, not the commit
      # being packaged: the release train may pass an older commit that
      # predates the script, and every run but a pull request selects all jobs.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # A pull request checks out GitHub's merge commit, whose first parent
          # is the base branch the change is compared with.
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Choose the Linux installer and commercial checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/desktop-packaging-scope.mjs

  linux-package:
    name: Package, check and launch the desktop app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty except when the release train calls: then the release commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and Electron main
        run: pnpm build:renderer:desktop && pnpm build:electron-main

      - name: Package the stable config as an unpacked Linux app
        run: pnpm exec electron-builder --linux dir --x64 --config electron-builder.yml --publish never

      - name: Check fuses and app.asar contents
        run: |
          app_dir="$(ls -d release/*/linux-unpacked)"
          node scripts/verify-packaged-desktop.mjs \
            "${app_dir}/kerfdesk" "${app_dir}/resources/app.asar" electron-builder.yml

      - name: Let Chromium's sandbox start on the runner
        # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor,
        # which Chromium's Linux sandbox needs. Allow them for this job rather
        # than launching KerfDesk with --no-sandbox.
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Launch, import and save in the packaged app
        run: |
          app_dir="$(pwd)/$(ls -d release/*/linux-unpacked)"
          xvfb-run -a pnpm smoke:desktop:native -- "${app_dir}/kerfdesk"

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-package-check-${{ inputs.ref || github.sha }}
          path: artifacts/native-smoke/
          if-no-files-found: warn
          retention-days: 14

  linux-installers:
    name: Package, install and launch the Linux AppImage and .deb
    needs: packaging-scope
    # Runs unless the scope job chose to skip it. A failed scope job leaves the
    # output empty, so this job runs rather than passing unseen (ADR-647).
    if: ${{ !cancelled() && needs.packaging-scope.outputs.installers != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Same shape as the dry run's 0.0.0-dispatch.N: never a real release number.
      VERSION: 0.0.0-check.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty except when the release train calls: then the release commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and Electron main at the check version
        env:
          KERFDESK_DESKTOP_VERSION: ${{ env.VERSION }}
        run: pnpm build:renderer:desktop && pnpm build:electron-main

      - name: Build the Linux AppImage and .deb from the Preview config
        run: |
          pnpm exec electron-builder --linux --x64 \
            --config electron-builder.preview.yml \
            --config.extraMetadata.version="${VERSION}" \
            --config.extraMetadata.kerfdeskUpdateChannelTrusted=false \
            --config.extraMetadata.kerfdeskDesktopReleaseChannel=preview \
            --config.forceCodeSigning=false \
            --publish never

      - name: Check the Linux package contract
        run: bash scripts/verify-linux-package.sh "${VERSION}"

      - name: Check fuses and app.asar contents
        run: |
          app_dir="release/${VERSION}/linux-unpacked"
          node scripts/verify-packaged-desktop.mjs \
            "${app_dir}/kerfdesk" "${app_dir}/resources/app.asar" electron-builder.preview.yml

      - name: Install the .deb as an operator would
        # Ubuntu 24.04 keeps its unprivileged user namespace restriction here:
        # the AppArmor profile the .deb installs is what lets Chromium's
        # sandbox start, as on an operator's computer.
        run: |
          sudo apt-get update
          # A desktop system has the MIME and desktop databases the .deb updates.
          sudo apt-get install -y xvfb shared-mime-info desktop-file-utils
          sudo apt-get install -y "./release/${VERSION}/KerfDesk-${VERSION}-linux-amd64.deb"
          test "$(readlink -f /usr/bin/kerfdesk)" = /opt/KerfDesk/kerfdesk
          grep -q '^application/x-kerfdesk-project=.*kerfdesk\.desktop' \
            /usr/share/applications/mimeinfo.cache
          grep -q 'application/x-kerfdesk-project' /usr/share/mime/globs2

      - name: Keep Ubuntu's user-namespace restriction on for both launches
        # Both launches below must prove the sandbox setup under Ubuntu's
        # default, so the restriction is set and checked rather than assumed.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1

      - name: Launch, import and save in the installed app
        run: xvfb-run -a pnpm smoke:desktop:native -- /opt/KerfDesk/kerfdesk

      - name: Launch, import and save in the AppImage, as double-clicked
        # Still with Ubuntu's restriction on: the AppImage's launcher must drop
        # Chromium's sandbox by itself here, where user namespaces are blocked.
        # And without libfuse2, which Ubuntu 22.04 and newer no longer install:
        # the static runtime must mount the AppImage with its own FUSE support.
        run: |
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then
            sudo apt-get remove -y 'libfuse2*'
          fi
          if ldconfig -p | grep -q 'libfuse\.so\.2'; then
            echo 'libfuse2 is still installed, so this would not prove the AppImage needs none.' >&2
            exit 1
          fi
          ls -l /dev/fuse
          command -v fusermount3 || sudo apt-get install -y fuse3
          appimage="$(pwd)/release/${VERSION}/KerfDesk-${VERSION}-linux-x86_64.AppImage"
          xvfb-run -a pnpm smoke:desktop:native -- "${appimage}"

      - name: Remove the .deb
        run: |
          sudo apt-get remove -y kerfdesk
          test ! -e /opt/KerfDesk/kerfdesk
          test ! -e /usr/share/applications/kerfdesk.desktop

      # No modified-app.asar check here: Electron 44 enforces ASAR integrity on
      # macOS and Windows only (docs/tutorial/asar-integrity.md), so a Linux
      # build starts with a modified app.asar whatever the fuse says (ADR-607).

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-package-check-linux-installers-${{ inputs.ref || github.sha }}
          path: artifacts/native-smoke/
          if-no-files-found: warn
          retention-days: 14

  # The commercial Mac and Linux builds of the unsigned lane (ADR-613) run only
  # after a Windows release, with the identity its protected job signed. These
  # rehearsals run the same script with a throwaway identity, signed by a key
  # this runner makes and pins in its own checkout, so a pull request proves the
  # build, package contract and launches long before a release depends on them.
  commercial-linux:
    # A literal name and no matrix: a skipped matrix job reports its name
    # unexpanded, and a running one gets the matrix value appended again, so
    # either way the required "(x64)" check would never report.
    name: Rehearse the commercial Linux build (x64)
    needs: packaging-scope
    if: ${{ !cancelled() && needs.packaging-scope.outputs.installers != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      REHEARSAL_ARCH: x64
      # A strict X.Y.Z, as a commercial build requires; never a real release.
      VERSION: 0.0.${{ github.run_number }}
    steps: &commercial-rehearsal-steps
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty except when the release train calls: then the release commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build renderer and Electron main at the rehearsal version
        env:
          KERFDESK_DESKTOP_VERSION: ${{ env.VERSION }}
        run: pnpm build:renderer:desktop && pnpm build:electron-main

      - name: Sign a throwaway release identity in place of the Windows job
        run: |
          node scripts/rehearse-commercial-identity.mjs \
            "${RUNNER_TEMP}/rehearsal-identity.json" "${VERSION}" "$(git rev-parse HEAD)"

      - name: Package and qualify exactly as the release does
        run: |
          platform="$(echo "${RUNNER_OS}" | tr "[:upper:]" "[:lower:]")"
          bash scripts/build-commercial-platform.sh "${platform}" "${{ env.REHEARSAL_ARCH }}" \
            "${VERSION}" "$(git rev-parse HEAD)" "${RUNNER_TEMP}/rehearsal-identity.json"

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-package-check-commercial-${{ runner.os }}-${{ env.REHEARSAL_ARCH }}-${{ inputs.ref || github.sha }}
          path: artifacts/native-smoke/
          if-no-files-found: warn
          retention-days: 14

  commercial-macos:
    name: Rehearse the commercial macOS build (${{ matrix.arch }})
    # macOS runs with the other native jobs (ADR-522 Amendment 1).
    if: ${{ inputs.native == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      REHEARSAL_ARCH: ${{ matrix.arch }}
      VERSION: 0.0.${{ github.run_number }}
    steps: *commercial-rehearsal-steps

  windows-package:
    name: Package, install and launch the Windows desktop app
    # Only the release train and manual runs set `native`; pull requests,
    # merge queue entries and pushes to main leave the inputs context empty, so
    # this job is skipped.
    if: ${{ inputs.native == true }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Same shape as the dry run's 0.0.0-dispatch.N: never a real release number.
      VERSION: 0.0.0-check.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty except when the release train calls: then the release commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the desktop and release script tests on Windows
        run: pnpm exec vitest run electron && pnpm test:release-integrity

      - name: Build renderer and Electron main at the check version
        shell: bash
        env:
          KERFDESK_DESKTOP_VERSION: ${{ env.VERSION }}
        run: pnpm build:renderer:desktop && pnpm build:electron-main

      - name: Build the unsigned Windows Preview installer as the release lane does
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder --win --x64 \
            --config electron-builder.preview.yml \
            --config.extraMetadata.version="${VERSION}" \
            --config.extraMetadata.kerfdeskUpdateChannelTrusted=false \
            --config.extraMetadata.kerfdeskDesktopReleaseChannel=preview \
            --config.forceCodeSigning=false \
            --publish never

      - name: Remove local updater metadata, as the release lane does
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath "release/$env:VERSION" -Recurse -File |
            Where-Object { $_.Name -match '^latest.*\.(yml|yaml|json)$' -or $_.Extension -eq '.blockmap' } |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force }

      - name: Check the Windows Preview package contract
        shell: pwsh
        run: ./scripts/verify-windows-preview-package.ps1 -Version $env:VERSION

      - name: Check fuses and app.asar contents
        shell: pwsh
        run: |
          $unpacked = "release/$env:VERSION/win-unpacked"
          node scripts/verify-packaged-desktop.mjs "$unpacked/KerfDesk.exe" "$unpacked/resources/app.asar" electron-builder.preview.yml

      - name: Install, launch, import, save and uninstall
        shell: pwsh
        run: |
          # The installed app shows the commit it was built from: the checked-out
          # one, which is not GITHUB_SHA when the release train names a commit.
          $sourceCommit = (git rev-parse HEAD).Trim()
          & ./scripts/qualify-windows-installer.ps1 `
            -Scenario Launch `
            -Installer "$env:GITHUB_WORKSPACE/release/$env:VERSION/KerfDesk-$env:VERSION-windows-x64-setup.exe" `
            -Version $env:VERSION `
            -SourceCommit $sourceCommit `
            -EvidenceRoot "$env:GITHUB_WORKSPACE/artifacts/installed-launch"

      - name: Check that a modified app.asar stops the app
        shell: pwsh
        run: |
          $unpacked = (Resolve-Path "release/$env:VERSION/win-unpacked").Path
          node scripts/verify-asar-integrity-enforced.mjs "$unpacked\KerfDesk.exe" "$unpacked\resources\app.asar"

      - name: Upload install and launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-package-check-windows-${{ inputs.ref || github.sha }}
          path: artifacts/installed-launch/
          if-no-files-found: warn
          retention-days: 14

  macos-package:
    name: Package and launch the macOS desktop app (${{ matrix.arch }})
    if: ${{ inputs.native == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    env:
      VERSION: 0.0.0-check.${{ github.run_number }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Empty except when the release train calls: then the release commit.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        # A pinned older commit may predate this action (ADR-712).
        if: hashFiles('.github/actions/electron-downloads/action.yml') != ''
        uses: ./.github/actions/electron-downloads
        with:
          packaging: 'true'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the desktop and release script tests on macOS
        run: pnpm exec vitest run electron && pnpm test:release-integrity

      - name: Build renderer and Electron main at the check version
        env:
          KERFDESK_DESKTOP_VERSION: ${{ env.VERSION }}
        run: pnpm build:renderer:desktop && pnpm build:electron-main

      - name: Build the unsigned macOS Preview DMG as the release lane does
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          pnpm exec electron-builder --mac "--${ARCH}" \
            --config electron-builder.preview.yml \
            --config.extraMetadata.version="${VERSION}" \
            --config.extraMetadata.kerfdeskUpdateChannelTrusted=false \
            --config.extraMetadata.kerfdeskDesktopReleaseChannel=preview \
            --config.forceCodeSigning=false \
            --publish never

      - name: Check the macOS Preview package contract
        run: bash scripts/verify-macos-preview-package.sh "${VERSION}" "${ARCH}"

      - name: Check fuses and app.asar, then launch, import and save from the DMG
        run: |
          mount_dir="$(mktemp -d)"
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" \
            "release/${VERSION}/KerfDesk-${VERSION}-macos-${ARCH}.dmg" >/dev/null
          trap 'bash scripts/detach-macos-dmg.sh "${mount_dir}"' EXIT
          app="${mount_dir}/KerfDesk.app"
          # On macOS the fuse wire lives in the Electron framework binary.
          node scripts/verify-packaged-desktop.mjs \
            "${app}/Contents/Frameworks/Electron Framework.framework/Electron Framework" \
            "${app}/Contents/Resources/app.asar" electron-builder.preview.yml
          pnpm smoke:desktop:native -- "${app}/Contents/MacOS/KerfDesk"

      - name: Check that a modified app.asar stops the app
        run: |
          app="$(pwd)/$(ls -d "release/${VERSION}"/mac*/KerfDesk.app)"
          node scripts/verify-asar-integrity-enforced.mjs \
            "${app}/Contents/MacOS/KerfDesk" "${app}/Contents/Resources/app.asar"

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-package-check-macos-${{ matrix.arch }}-${{ inputs.ref || github.sha }}
          path: artifacts/native-smoke/
          if-no-files-found: warn
          retention-days: 14
