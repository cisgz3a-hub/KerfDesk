name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued pull request on a gh-readonly-queue/main/...
  # branch and waits for the required checks this workflow reports (ADR-645).
  merge_group:
    types: [checks_requested]

# Cancel in-progress runs on the same PR branch when a new commit lands —
# but NOT on main. Rapid merge trains (2026-07-21) cancelled every main run
# before it finished, so main never got a completed verdict and deploy.yml,
# which fires only on a successful CI completion, starved: production sat
# hours stale while PRs kept landing. With cancellation off, the in-flight
# main run always finishes and triggers a deploy of its validated SHA;
# GitHub still keeps only one PENDING run per group, so intermediate queued
# pushes are superseded (shown as cancelled) and the tip always runs.
# A merge queue run has its own gh-readonly-queue/main/pr-N-<sha> ref, so it
# never shares a group with a pull request, main or another queued entry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The release gate runs as parallel jobs rather than one `pnpm release:check`
# chain (ADR-557). Every command in release:check runs in one of these
# jobs, and the unit tests are split into shards. The last job keeps the
# gate's check name and passes only when every other job passed, so a required
# check of that name, and deploy.yml's trigger on a successful CI run, still
# mean the whole gate passed. scripts/ci-parallel-gate.test.mjs pins both.
# Every job has a time limit at about twice its 90th-percentile run time, so
# a hung job fails within the hour instead of GitHub's 6 hours (code-quality
# audit C2 D7-P3-1).
jobs:
  static-checks:
    name: Typecheck, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        # No `with.version` — pnpm/action-setup@v6 rejects when both
        # the action input AND package.json's `packageManager` field
        # are set. We pin via packageManager: "pnpm@11.3.0" in
        # package.json (npm-standard, more specific). The action
        # reads it automatically.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 22 LTS — required by pnpm 11.3.0 (which uses node:sqlite,
          # added in Node 22.5). Bumped from 20 after pnpm/action-setup@v4
          # surfaced the version conflict. Node 20 goes EOL Apr 2026; 22
          # is the current LTS through Apr 2027.
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Lint the Electron main process and its tests
        run: pnpm lint:electron

      # Vitest strips types without checking them, and the build project
      # (electron/tsconfig.json) leaves the tests out (audit C1-P2-1).
      - name: Type-check the Electron tests
        run: pnpm typecheck:electron-tests

      - name: Check the published privacy notice
        run: pnpm check:privacy

      # Pricing, terms, refunds and safety ship on kerfdesk.com from public/
      # (ADR-524 Amendment 3 decision 2): fail when one differs from its source.
      - name: Check the published pricing and policy pages
        run: pnpm check:public-info

      - name: Check formatting
        run: pnpm format:check

  policy-and-build:
    name: Policy checks and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check ADR numbers
        run: pnpm check:adr-numbers

      # Deploy and every release run this guard; running it here too means a
      # change to the index.html shell fails its pull request, not the release.
      - name: Check the repository guard
        run: pnpm guard:repo

      - name: Check GitHub Actions pins
        run: pnpm check:action-pins

      # Every secret is read only by a job that names the environment holding
      # it, so no branch workflow needs a repository secret (ADR-651).
      - name: Check workflow secret scopes
        run: pnpm check:secret-scopes

      - name: Check dependency licences
        run: pnpm license-check

      - name: Run the release script tests
        run: pnpm test:release-integrity

      # Pins the cache folders to the ones @electron/get and electron-builder
      # use, and that every installing or packaging job restores them (ADR-712).
      - name: Run the Electron download cache tests
        run: node --test .github/actions/electron-downloads/electron-downloads.test.mjs

      - name: Run the website tests
        run: pnpm website:test

      - name: Build the web app
        run: pnpm build:web

      # Counts the first visit's gzip bytes against a checked-in baseline and
      # refuses worker-only libraries in it (performance audit S9-P3-2).
      - name: Check the boot bundle size
        run: pnpm check:boot-bundle

      - name: Build the Electron main process
        run: pnpm build:electron-main

      - name: Check file sizes
        run: pnpm check:file-size

      - name: Report files over the soft line limit
        run: pnpm check:soft-size

      - name: Check index exports
        run: pnpm check:index-exports

  windows-native-tests:
    name: Windows native upgrade controls
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Check native upgrade menu invocation
        # This Node/PowerShell regression is skipped on the Linux release gate.
        # It uses Windows UI Automation types and needs no package installation.
        run: node --test scripts/installed-upgrade-menu.test.mjs

  unit-tests:
    name: Unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every shard reports, so one failure does not hide another shard's.
      fail-fast: false
      matrix:
        # Vitest splits the test files evenly by a hash of their paths. Keep
        # the list 1..N: the job total is the shard count.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run this shard of the unit tests
        run: pnpm test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  remote-control:
    name: Phone and MCP service
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KERFDESK_TEST_BROWSER: chromium
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Prepare the service checks
        uses: ./.github/actions/setup-remote-control

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install shared desktop dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the phone and MCP service
        run: pnpm check:remote-control

  ci:
    name: Lint, typecheck, license, test, build
    needs: [static-checks, policy-and-build, windows-native-tests, unit-tests, remote-control]
    # Runs whatever the jobs above did, so a failed or cancelled job fails
    # this check instead of skipping it: GitHub counts a skipped required
    # check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        # pnpm installs the dependencies before it runs a script in a checkout
        # without them, so the readiness report below would install uncached.
        run: pnpm install --frozen-lockfile

      - name: Release verification gate
        id: release_check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          not_passed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "${NEEDS}")"
          if [ -n "${not_passed}" ]; then
            echo "The release gate passes only when every CI job passed. Not passed:"
            echo "${not_passed}"
            exit 1
          fi
          echo "Every CI job passed."

      - name: Record SHA-correlated readiness lanes
        if: always()
        env:
          CI_STATE: ${{ steps.release_check.outcome }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm report:release-readiness
          --state=ci=${CI_STATE}
          --state=browser=not-run
          --state=deploy=not-run
          --state=packaged-runtime=not-run
          --state=perceptual-reference-cam=not-run
          --state=hardware=not-run
          "--evidence=ci=1 release:check gate in parallel jobs; result=${CI_STATE}; run=${WORKFLOW_RUN_URL}"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-ci-${{ github.sha }}
          path: artifacts/release-readiness/
          retention-days: 30
