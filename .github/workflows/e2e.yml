name: Browser smoke

# Runs on main pushes as well as PRs so a direct-to-main commit (which
# happens in this repo) still gets the only automated check that loads the
# real app in a browser (rolling audit 2026-07-17-0450 P2-1). OBSERVABILITY
# ONLY on main: deploy.yml gates on the CI workflow alone — making deploys
# additionally require this workflow would be a new blocking gate and needs
# explicit maintainer approval per ADR-206 first.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each queued pull request on a gh-readonly-queue/main/...
  # branch and waits for the required checks this workflow reports (ADR-645).
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

# Same rule as ci.yml: a new push cancels a PR branch's in-progress run, but
# every main run finishes. Cancelling on main left many published commits
# with only a cancelled Browser smoke run (2026-09-25 audit, DEP-1). GitHub
# still keeps one pending run per group, so a burst of merges runs the tip.
# Each merge queue entry has its own gh-readonly-queue ref, so its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The development suite runs in shards on separate runners, each still with
# one Playwright worker and its own Vite server, beside one job for the checks
# that run once. The last job keeps the "Chrome UX smoke" check name and passes
# only when every other job passed (ADR-557).
#
# A pull request runs a focused part of the suite in one job instead of the
# shards: fixed core files plus every spec the pull request changed. Pushes to
# main, merge queue entries and manual runs still run the whole suite, so a
# breakage only the rest of the suite sees shows up on main's run (ADR-647).
# When a pull request's selection is over 40 spec files (a helper most specs
# import changed), it runs the shards instead: one job ran 476 tests for
# 2 h 15 m (ADR-647 Amendment 1). Every job has a time limit at about twice
# its 90th-percentile run time (code-quality audit C2 D7-P3-1).
jobs:
  plan:
    name: Choose the pull request's browser specs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GitHub's merge commit and its first parent, the base branch, so
          # Playwright can tell which specs the pull request changed.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Choose the focused job or the whole suite in shards
        id: plan
        run: pnpm test:e2e:pull-request HEAD^1 --plan

  checks:
    name: Browser test checks and production-bundle smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        # --with-deps fetches optional fonts from the Ubuntu archive. When the
        # runner cannot reach it (2026-11-11 DNS failures), keep the runner
        # image's preinstalled Google Chrome, which has every library it needs.
        run: |
          set +e
          pnpm exec playwright install --with-deps chrome
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::playwright install --with-deps chrome failed; using the runner's preinstalled Google Chrome"
            google-chrome --version
          fi

      - name: Type-check browser tests
        run: pnpm typecheck:e2e

      - name: Verify browser test discovery
        run: pnpm check:e2e-discovery

      - name: Check cold startup and viewer responsiveness
        # Check viewer responsiveness early so its failure trace is available
        # without waiting for the full suite. The suite's shards still run it.
        run: pnpm test:e2e:cold && pnpm test:e2e e2e/connected-script-gcode-viewer.e2e.ts

      - name: Run the production-bundle browser smoke
        run: pnpm test:e2e:production-bundle

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-checks
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  suite:
    name: Chrome UX smoke (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: plan
    # The plan job runs only on a pull request; everywhere else it is skipped
    # and the shards run. A failed plan runs neither suite job and fails the
    # gate below.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.plan.outputs.suite == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      # Every shard reports, so one failure does not hide another shard's.
      fail-fast: false
      matrix:
        # Playwright splits the suite's files into shards of about the same
        # number of tests. Keep the list 1..N: the job total is the shard count.
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        # --with-deps fetches optional fonts from the Ubuntu archive. When the
        # runner cannot reach it (2026-11-11 DNS failures), keep the runner
        # image's preinstalled Google Chrome, which has every library it needs.
        run: |
          set +e
          pnpm exec playwright install --with-deps chrome
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::playwright install --with-deps chrome failed; using the runner's preinstalled Google Chrome"
            google-chrome --version
          fi

      - name: Check cold startup
        # Also leaves Vite's dependency cache warm, as it was for the whole
        # suite when one job ran it after this check.
        run: pnpm test:e2e:cold

      - name: Run this shard of the development browser suite
        run: pnpm test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  pull-request-suite:
    name: Chrome UX smoke (pull request core and changed specs)
    needs: plan
    if: github.event_name == 'pull_request' && needs.plan.outputs.suite == 'focused'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GitHub's merge commit and its first parent, the base branch, so
          # Playwright can tell which specs the pull request changed.
          fetch-depth: 2

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome
        # --with-deps fetches optional fonts from the Ubuntu archive. When the
        # runner cannot reach it (2026-11-11 DNS failures), keep the runner
        # image's preinstalled Google Chrome, which has every library it needs.
        run: |
          set +e
          pnpm exec playwright install --with-deps chrome
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::playwright install --with-deps chrome failed; using the runner's preinstalled Google Chrome"
            google-chrome --version
          fi

      - name: Check cold startup
        run: pnpm test:e2e:cold

      - name: Run the core specs and the specs this pull request changed
        run: pnpm test:e2e:pull-request HEAD^1

      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-pull-request
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  chrome:
    name: Chrome UX smoke
    needs: [plan, checks, suite, pull-request-suite]
    # Runs whatever the jobs above did, so a failed or cancelled job fails
    # this check instead of skipping it: GitHub counts a skipped required
    # check as passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Restore Electron downloads
        uses: ./.github/actions/electron-downloads

      - name: Install dependencies
        # pnpm installs the dependencies before it runs a script in a checkout
        # without them, so the readiness report below would install uncached.
        run: pnpm install --frozen-lockfile

      - name: Require every browser job to pass
        id: browser_smoke
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs this run does not use; they alone may be skipped. Outside a
          # pull request that is the plan and the pull request job; on one, the
          # suite job its plan did not choose.
          SKIPPABLE_JOBS: ${{ github.event_name != 'pull_request' && 'plan pull-request-suite' || needs.plan.outputs.suite == 'full' && 'pull-request-suite' || 'suite' }}
        run: |
          not_passed="$(jq -r --arg skippable "${SKIPPABLE_JOBS}" 'to_entries[] | select(.value.result != "success" and (.value.result != "skipped" or (.key | IN($skippable | split(" ")[]) | not))) | "\(.key): \(.value.result)"' <<< "${NEEDS}")"
          if [ -n "${not_passed}" ]; then
            echo "Browser smoke passes only when every browser job passed. Not passed:"
            echo "${not_passed}"
            exit 1
          fi
          echo "Every browser job passed."

      - name: Record SHA-correlated readiness lanes
        if: always()
        env:
          BROWSER_STATE: ${{ steps.browser_smoke.outcome }}
          SUITE_SCOPE: ${{ github.event_name == 'pull_request' && needs.plan.outputs.suite == 'focused' && 'pull request core and changed specs' || 'full dev suite in shards' }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm report:release-readiness
          --state=ci=not-run
          --state=browser=${BROWSER_STATE}
          --state=deploy=not-run
          --state=packaged-runtime=not-run
          --state=perceptual-reference-cam=not-run
          --state=hardware=not-run
          "--evidence=browser=4 checks: cold dev start, viewer responsiveness, ${SUITE_SCOPE}, production dist/web bundle; result=${BROWSER_STATE}; run=${WORKFLOW_RUN_URL}"

      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-browser-${{ github.sha }}
          path: artifacts/release-readiness/
          retention-days: 30
