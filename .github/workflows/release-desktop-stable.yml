name: Release Desktop Stable

# Builds the downloadable Windows installer + the electron-updater feed
# (ADR-024). This is SEPARATE from ci.yml/deploy.yml (which gate + deploy the
# web app) so the desktop release never blocks, and is never blocked by, a web
# deploy.
#
# Trigger: an annotated SemVer tag `vX.Y.Z` cuts a release (the tag drives the
# installer version — see ADR-024 "version reconciliation"). This production
# workflow intentionally has no workflow_dispatch trigger and uses a new path.
# Credential-free manual packaging lives in release-desktop-dry-run.yml. Disable
# the historical release-desktop.yml workflow ID before this rename merges. The
# desktop-production environment and new STABLE_* secrets are required only
# before a future stable tag, not for the free Preview-governance merge.
#
# Tag releases are fail-closed signed builds (ADR-135/142).
#
# Retired while commercial releases own vX.Y.Z tags (ADR-556): a commercial
# tag must not also build and publish this free installer, which has the same
# version and app ID. The lane runs only when the owner sets the repository
# variable KERFDESK_LEGACY_STABLE_LANE to on.
on:
  push:
    # Keep prerelease tags out of the signed stable lane. The negative pattern
    # must follow the positive pattern for GitHub's ordered tag filters.
    tags: ['v*', '!v*-*']

concurrency:
  # Every tag changes the same stable feed. Hold the shared owner while building
  # and publishing; the publisher also rejects versions older than the live feed.
  group: kerfdesk-stable-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  validate-stable-tag:
    name: Validate stable release tag
    # Every later job needs this one, so the whole lane is skipped when it is off.
    if: vars.KERFDESK_LEGACY_STABLE_LANE == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22

      - name: Reject non-stable or lightweight tags
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: node scripts/validate-release-tag.mjs stable "${GITHUB_REF_NAME}"

      - name: Require the tagged commit to belong to current main history
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main

      - name: Require the explicitly approved release commit
        env:
          APPROVED_RELEASE_SHA: ${{ vars.STABLE_APPROVED_RELEASE_SHA }}
        run: |
          if [ -z "${APPROVED_RELEASE_SHA}" ]; then
            echo 'STABLE_APPROVED_RELEASE_SHA must name the reviewed release commit.' >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${APPROVED_RELEASE_SHA}"

  build-windows:
    name: Build Windows installer
    needs: validate-stable-tag
    runs-on: windows-latest
    environment: desktop-production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history preserves deterministic build metadata. The visible
          # renderer version and installer version both come from the tag.
          fetch-depth: 0

      - name: Set up pnpm
        # No `with.version` — package.json's packageManager field is the single
        # source of truth (see ci.yml).
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive release version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Release version: ${VERSION}"

      - name: Verify canonical release repository
        run: pnpm guard:repo

      - name: Select original artifact for a same-run retry
        id: retry
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPROVED_RELEASE_SHA: ${{ vars.STABLE_APPROVED_RELEASE_SHA }}
          STABLE_PUBLICATION_GROUP: kerfdesk-stable-publication
        run: node scripts/stable-release-retry.mjs "${{ steps.version.outputs.version }}"

      - name: Release verification gate
        # Same green-gate as the web CI, on Windows. Also builds dist/web and
        # dist-electron, which electron-builder then packages.
        env:
          KERFDESK_DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: pnpm release:check && pnpm build:bundle:desktop

      - name: Require a clean packaged-runtime dependency graph
        shell: bash
        run: |
          mkdir -p artifacts/dependency-audit
          set +e
          pnpm audit --json > artifacts/dependency-audit/full.json
          full_exit=$?
          pnpm audit --prod --json > artifacts/dependency-audit/runtime.json
          runtime_exit=$?
          set -e
          pnpm report:dependency-audit \
            --full=artifacts/dependency-audit/full.json \
            --runtime=artifacts/dependency-audit/runtime.json \
            --full-exit="${full_exit}" \
            --runtime-exit="${runtime_exit}" \
            --output=artifacts/dependency-audit
          runtime_count=$(node -p "require('./artifacts/dependency-audit/report.json').runtimeCount")
          test "${runtime_count}" = '0'

      # The signing key lives in SSL.com's eSigner cloud vault; no .pfx exists
      # (ADR-142 Amendment 1). The TOTP secret is the one shown when the
      # certificate was enrolled in eSigner.
      - name: Require tag-release signing credentials
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          ESIGNER_USERNAME: ${{ secrets.STABLE_ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.STABLE_ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.STABLE_ESIGNER_TOTP_SECRET }}
        run: |
          foreach ($name in 'ESIGNER_USERNAME', 'ESIGNER_PASSWORD', 'ESIGNER_TOTP_SECRET') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Tag releases require the STABLE_$name secret."
            }
          }

      # eSigner CKA presents the cloud certificate to Windows as an ordinary
      # certificate in CurrentUser\My, so signtool signs with it by thumbprint.
      # The installer is pinned by URL and SHA-256.
      - name: Load the eSigner signing certificate
        id: signing-certificate
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.retry.outputs.reuse-artifact == 'false'
        shell: pwsh
        env:
          ESIGNER_CKA_URL: https://github.com/SSLcom/eSignerCKA/releases/download/v1.1.2/SSL.COM-eSigner-CKA_1.1.2.zip
          ESIGNER_CKA_SHA256: 071ca52986795e7a00dfbd87cc5818d03af74daac32dfe32afd4171b676c4d13
          ESIGNER_USERNAME: ${{ secrets.STABLE_ESIGNER_USERNAME }}
          ESIGNER_PASSWORD: ${{ secrets.STABLE_ESIGNER_PASSWORD }}
          ESIGNER_TOTP_SECRET: ${{ secrets.STABLE_ESIGNER_TOTP_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'esigner-cka.zip'
          Invoke-WebRequest -Uri $env:ESIGNER_CKA_URL -OutFile $zip
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($hash -ne $env:ESIGNER_CKA_SHA256) {
            throw "eSigner CKA download has SHA-256 $hash, expected $env:ESIGNER_CKA_SHA256."
          }
          $setupDir = Join-Path $env:RUNNER_TEMP 'esigner-cka-setup'
          Expand-Archive -LiteralPath $zip -DestinationPath $setupDir -Force
          $setup = @(Get-ChildItem -LiteralPath $setupDir -Recurse -Filter '*.exe')
          if ($setup.Count -ne 1) { throw "Expected one eSigner CKA installer, found $($setup.Count)." }
          $installDir = Join-Path $env:USERPROFILE 'eSignerCKA'
          Start-Process -FilePath $setup[0].FullName -Wait -ArgumentList @(
            '/CURRENTUSER', '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=`"$installDir`"")
          # SSL.com's GitHub Actions sample registers the key provider next.
          foreach ($helper in 'RegisterKSP.exe', 'eSignerCSP.Config.exe') {
            $helperPath = Join-Path $installDir $helper
            if (Test-Path -LiteralPath $helperPath) { & $helperPath | Out-Null }
          }
          $tool = Join-Path $installDir 'eSignerCKATool.exe'
          if (-not (Test-Path -LiteralPath $tool)) { throw "eSigner CKA did not install $tool." }
          & $tool config -mode product -user $env:ESIGNER_USERNAME -pass $env:ESIGNER_PASSWORD `
            -totp $env:ESIGNER_TOTP_SECRET -key (Join-Path $installDir 'master.key') -r
          & $tool unload
          & $tool load
          $certificates = @(Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert)
          if ($certificates.Count -ne 1) {
            throw ("Expected one eSigner code-signing certificate, found $($certificates.Count). " +
              'Check the eSigner username, password and TOTP secret.')
          }
          # The newest Windows SDK signtool, as SSL.com's sample uses.
          $signtool = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw 'No Windows SDK signtool.exe on this runner.' }
          "Signing as $($certificates[0].Subject) with $($signtool.FullName)"
          "thumbprint=$($certificates[0].Thumbprint)" >> $env:GITHUB_OUTPUT
          "signtool=$($signtool.FullName)" >> $env:GITHUB_OUTPUT

      - name: Build signed Windows installer + update feed
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.retry.outputs.reuse-artifact == 'false'
        shell: bash
        # dist/web + dist-electron already exist from release:check; package
        # them. `-c.extraMetadata.version` overrides package.json's static
        # 0.1.0 so the .exe, app.getVersion(), and latest.yml all agree.
        # `--publish never` still emits latest.yml + .blockmap locally; upload
        # to R2 happens in a later step. electron-builder signs every .exe with
        # the store certificate named by thumbprint (sha256, ts.ssl.com; see
        # electron-builder.yml) and writes its CN into app-update.yml as the
        # publisherName that electron-updater checks each update against.
        run: |
          pnpm exec electron-builder --win --x64 \
            --config.extraMetadata.version="${{ steps.version.outputs.version }}" \
            --config.extraMetadata.kerfdeskUpdateChannelTrusted=true \
            --config.forceCodeSigning=true \
            --config.win.signtoolOptions.certificateSha1="${WIN_CERTIFICATE_SHA1}" \
            --publish never
        env:
          WIN_CERTIFICATE_SHA1: ${{ steps.signing-certificate.outputs.thumbprint }}
          SIGNTOOL_PATH: ${{ steps.signing-certificate.outputs.signtool }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'

      - name: Restore the original signed release instance
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.retry.outputs.reuse-artifact == 'true'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          artifact-ids: ${{ steps.retry.outputs.artifact-id }}
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          path: release/${{ steps.version.outputs.version }}
          merge-multiple: true

      - name: Verify signed tag installer
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REUSE_ARTIFACT: ${{ steps.retry.outputs.reuse-artifact }}
        run: |
          $installer = "release/$env:VERSION/KerfDesk-$env:VERSION-windows-x64-setup.exe"
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid') {
            throw "Installer Authenticode signature is not valid: $($signature.StatusMessage)"
          }
          if ([string]::IsNullOrWhiteSpace($signature.SignerCertificate.Subject)) {
            throw 'Installer signature has no publisher identity.'
          }
          # Without a timestamp the signature stops validating when the
          # certificate expires, and installed copies would refuse the update.
          if ($null -eq $signature.TimeStamperCertificate) {
            throw 'Installer signature has no timestamp.'
          }
          & ./scripts/verify-windows-package-identity.ps1 `
            -Executable $installer `
            -Kind Installer
          if ($env:REUSE_ARTIFACT -ne 'true') {
            $executable = "release/$env:VERSION/win-unpacked/KerfDesk.exe"
            & ./scripts/verify-windows-package-identity.ps1 -Executable $executable
            $appSignature = Get-AuthenticodeSignature -LiteralPath $executable
            if ($appSignature.Status -ne 'Valid' -or
                $appSignature.SignerCertificate.Thumbprint -ne $signature.SignerCertificate.Thumbprint) {
              throw 'KerfDesk.exe is not validly signed by the installer certificate.'
            }
            # Installed copies accept an update only from this publisher
            # (ADR-135); a missing publisherName would skip that check.
            node scripts/verify-update-publisher.mjs `
              "release/$env:VERSION/win-unpacked/resources/app-update.yml" `
              $signature.SignerCertificate.Subject
            if ($LASTEXITCODE -ne 0) { throw 'app-update.yml does not name the installer signer.' }
          }
          "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: Record checksums, SBOM, and normalized build provenance
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.retry.outputs.reuse-artifact == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pnpm list --prod --json --depth Infinity > "release/${VERSION}/runtime-dependencies.json"
          node scripts/generate-release-evidence.mjs \
            --release-dir="release/${VERSION}" \
            --version="${VERSION}" \
            --source-sha="${GITHUB_SHA}" \
            --dependency-json="release/${VERSION}/runtime-dependencies.json" \
            --package-file=package.json \
            --artifact="KerfDesk-${VERSION}-windows-x64-setup.exe" \
            --artifact="KerfDesk-${VERSION}-windows-x64-setup.exe.blockmap" \
            --artifact=latest.yml
          (cd "release/${VERSION}" && sha256sum --check checksums.sha256)

      - name: Upload installer + update feed as workflow artifact
        if: github.event_name == 'push' && github.ref_type == 'tag' && steps.retry.outputs.reuse-artifact == 'false'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kerfdesk-windows-${{ steps.version.outputs.version }}
          path: |
            release/${{ steps.version.outputs.version }}/*.exe
            release/${{ steps.version.outputs.version }}/*.exe.blockmap
            release/${{ steps.version.outputs.version }}/latest.yml
            release/${{ steps.version.outputs.version }}/checksums.sha256
            release/${{ steps.version.outputs.version }}/release-sbom.spdx.json
            release/${{ steps.version.outputs.version }}/release-provenance.json
          if-no-files-found: error

      # Publish to the self-hosted electron-updater feed on Cloudflare R2
      # (ADR-024). This production workflow is tag-push-only; credential-free
      # packaging exercises live in release-desktop-dry-run.yml. Requires the
      # desktop-production environment secrets STABLE_R2_API_TOKEN (with
      # R2-write scope) + STABLE_CLOUDFLARE_ACCOUNT_ID, and an R2 bucket
      # `kerfdesk-downloads` mapped to https://dl.kerfdesk.com (the publish.url
      # in electron-builder.yml). The bucket key layout mirrors that URL:
      # latest.yml + the versioned .exe/.blockmap live under `desktop/`.
      - name: Publish installer + update feed to Cloudflare R2
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STABLE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STABLE_CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          APPROVED_RELEASE_SHA: ${{ vars.STABLE_APPROVED_RELEASE_SHA }}
          STABLE_PUBLICATION_GROUP: kerfdesk-stable-publication
        # The publisher reserves immutable byte identities, resumes exact retries,
        # verifies every readback and the remote signature, and moves latest.yml
        # last. Only a confirmed missing object can start a first stable release.
        run: node scripts/publish-stable-release.mjs "release/${VERSION}" "${VERSION}"
