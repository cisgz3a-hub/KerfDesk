name: Dependency audit

# `pnpm audit` used to sit inside the `release:check` chain, so a newly
# published advisory against a transitive devDependency turned every open PR
# and every main push red with no code change — three times in July 2026
# (tar, postcss, brace-expansion). Worse, release:check is a sequential `&&`
# chain, so the audit failure masked the seven verification steps after it:
# a two-minute "failure" told the author nothing about their own diff.
#
# Advisories are published by third parties on their schedule, not ours, so
# supply-chain findings belong on a clock, not in the merge gate. This runs
# nightly and files ONE tracking issue; PRs stay green. GitHub Dependabot
# alerts (enabled 2026-07-25) cover the same ground natively — this leg still
# exists because it reads the tree through the same `pnpm audit` that the
# `pnpm.overrides` entries in pnpm-workspace.yaml are written against.
#
# See ADR-254.
on:
  schedule:
    # 03:17 UTC, deliberately off the hour: GitHub delays cron runs scheduled
    # on the hour under peak load, and nothing here is time-critical.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only by the tracking-issue step below.
  issues: write

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        # No `with.version` — see ci.yml. package.json's packageManager field
        # is the single source of truth.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency audits
        id: audit
        # Deliberately never fails the step: the report is the product, not
        # the exit code. Capturing the status lets the next step decide.
        run: |
          set +e
          mkdir -p artifacts/dependency-audit
          pnpm audit --json > artifacts/dependency-audit/full.json
          full_exit=$?
          pnpm audit --prod --json > artifacts/dependency-audit/runtime.json
          runtime_exit=$?
          echo "full_exit=${full_exit}" >> "$GITHUB_OUTPUT"
          echo "runtime_exit=${runtime_exit}" >> "$GITHUB_OUTPUT"

      - name: Classify dependency reachability
        id: classify
        run: >-
          pnpm report:dependency-audit
          --full=artifacts/dependency-audit/full.json
          --runtime=artifacts/dependency-audit/runtime.json
          --output=artifacts/dependency-audit
          --github-output=${GITHUB_OUTPUT}

      - name: Refresh dependency tracking issue
        if: steps.classify.outputs.total_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: 'Dependency audit: advisories found'
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -1)
          {
            echo "Nightly dependency evidence for commit \`${GITHUB_SHA}\`."
            echo
            cat artifacts/dependency-audit/report.md
          } > "${RUNNER_TEMP}/issue-body.md"
          if [ -n "${existing}" ]; then
            gh issue edit "${existing}" --body-file "${RUNNER_TEMP}/issue-body.md"
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file "${RUNNER_TEMP}/issue-body.md"
          fi

      - name: Close clean dependency tracking issue
        if: steps.classify.outputs.total_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: 'Dependency audit: advisories found'
        run: |
          existing=$(gh issue list --state open --limit 100 --json number,title \
            --jq '.[] | select(.title == env.ISSUE_TITLE) | .number' | head -1)
          if [ -n "${existing}" ]; then
            gh issue close "${existing}" --comment "Nightly audits are clean at ${GITHUB_SHA}; closing until a future run reports an advisory."
          fi

      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-audit-${{ github.sha }}
          path: artifacts/dependency-audit/
          retention-days: 30
