name: Deploy to Cloudflare Pages

# A workflow_run deploy runs on the default branch, so the run list would show
# main's tip at trigger time, not the commit CI validated; name the run after
# the candidate so the list says what each run was deciding about (ADR-360).
run-name: >-
  Deploy ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

# Runs AFTER the CI workflow succeeds on main (R-H5 audit fix —
# previously deploy ran in parallel with CI, so a commit that broke
# tests / lint but built cleanly would publish). Manual trigger from
# the Actions tab still works for re-deploys without a new commit
# (e.g. after editing _headers).
#
# Cloudflare Pages serves a "Preview" environment per branch by default;
# the Pages project production branch is main, matching the GitHub
# default branch. See note in package.json's deploy:web script.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One serialized production publication lane exists. Queueing every candidate
# prevents an obsolete historical rerun from canceling or replacing an eligible
# current-main deployment before the freshness resolver can classify it. Stale
# candidates reach that resolver in turn and become provider-free no-ops.
concurrency:
  group: deploy-production-main
  queue: max

# Required for actions/checkout — read access is enough; the deploy
# itself authenticates via the Pages-only PAGES_CLOUDFLARE_API_TOKEN, not
# GITHUB_TOKEN. The renamed credential prevents historical desktop workflows
# from reusing the web-deploy token for R2.
permissions:
  contents: read
  # Read-only: the candidate phase lists successful main CI runs and manual
  # production deploys to find a newer verified commit (ADR-360).
  actions: read

jobs:
  deploy:
    name: Build + deploy web bundle
    runs-on: ubuntu-latest
    # workflow_run fires for EVERY CI completion (success + failure).
    # Manual dispatches are production deploys, so the selected ref must
    # be main and the job still re-runs the shared release gate below.
    # Only a push to main is a production candidate: `branches: [main]`
    # matches a triggering run's head branch, which a fork PR can also name
    # main (ADR-360).
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # M33 (AUDIT-2026-06-10): for workflow_run events GITHUB_SHA is the
          # default branch's CURRENT tip, not the commit whose CI succeeded —
          # a push race (or a re-run of an old green CI) would deploy a
          # different commit than the one validated. Pin the checkout to the
          # triggering run's head SHA. Manual dispatch has no historical-ref
          # input: it checks out main as it was when dispatched (github.sha),
          # so the run records the tree it builds; if main moved while it
          # queued, the resolver no-ops it instead of building a newer tip
          # than its own record (ADR-360).
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          # Fetch full history so the version badge's `git rev-list --count
          # HEAD` (the auto build number, see vite.config.ts appVersion) is the
          # real total, not the shallow-clone 1. `git rev-parse --short HEAD`
          # for the SHA works at any depth.
          fetch-depth: 0

      - name: Set up pnpm
        # See ci.yml for why no `with.version` — package.json's
        # packageManager field is the single source of truth.
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          # Node 22 LTS — see ci.yml comment. pnpm 11.3.0 needs ≥22.13.
          node-version: 22
          cache: pnpm

      - name: Resolve current-main deployment identity
        id: deployment_identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONTROL_SHA: ${{ github.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          control_resolver="${RUNNER_TEMP}/resolve-web-deploy-identity.mjs"
          git merge-base --is-ancestor "${WORKFLOW_CONTROL_SHA}" refs/remotes/origin/main
          git show "${WORKFLOW_CONTROL_SHA}:scripts/resolve-web-deploy-identity.mjs" \
            > "${control_resolver}"
          git show "${WORKFLOW_CONTROL_SHA}:scripts/list-reverted-in-candidate.mjs" \
            > "${RUNNER_TEMP}/list-reverted-in-candidate.mjs"
          checkout_sha="$(git rev-parse HEAD)"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"
          evidence="${RUNNER_TEMP}/deploy-evidence"
          mkdir -p "${evidence}"
          if git merge-base --is-ancestor "${checkout_sha}" "${current_main_sha}"; then
            checkout_on_main=true
          else
            checkout_on_main=false
          fi
          # ADR-360: main's CI verifies one commit at a time, so any merge during
          # a run leaves the verified commit behind the tip. It still builds if
          # no newer commit on main has passed CI or been published, and main
          # has not reverted anything it contains. The tip and a manual dispatch
          # need no lookup; the resolver throws if a list it needs was not written.
          if [ "${EVENT_NAME}" = workflow_run ] && [ "${checkout_sha}" != "${current_main_sha}" ] && [ "${checkout_on_main}" = true ]; then
            git rev-list "${checkout_sha}..${current_main_sha}" > "${evidence}/newer-main-commits.txt"
            # Newer commits whose push CI on main passed: their own runs publish them.
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f branch=main -f event=push -f status=success -f per_page=100 \
              --jq '.workflow_runs[].head_sha' > "${evidence}/verified-shas.txt"
            # Newer commits a deploy actually published: run-name "Deploy <sha>"
            # and a successful publish step in any attempt, however the run ended
            # and whatever triggered it.
            gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs" \
              -f status=completed -f per_page=100 \
              --jq '.workflow_runs[] | select(.conclusion != "skipped") | "\(.id) \(.display_title)"' |
              while read -r run_id title; do
                published_sha="${title#Deploy }"
                if grep -qxF "${published_sha}" "${evidence}/newer-main-commits.txt"; then
                  published_steps="$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs" \
                    -f filter=all --jq '[.jobs[].steps[]? | select(.name == "Publish to Cloudflare Pages" and .conclusion == "success")] | length')"
                  if [ "${published_steps}" != "0" ]; then echo "${published_sha}"; fi
                fi
              done >> "${evidence}/verified-shas.txt"
            # A revert adds a commit, so a reverted tree is still on main.
            node "${RUNNER_TEMP}/list-reverted-in-candidate.mjs" \
              --candidate="${checkout_sha}" --main="${current_main_sha}" \
              --output="${evidence}/reverted-in-candidate.txt"
          fi
          node "${control_resolver}" \
            --event-name="${EVENT_NAME}" \
            --phase=candidate \
            --checkout-sha="${checkout_sha}" \
            --current-main-sha="${current_main_sha}" \
            --validated-sha="${VALIDATED_SHA}" \
            --checkout-on-main="${checkout_on_main}" \
            --newer-main-commits-file="${evidence}/newer-main-commits.txt" \
            --verified-shas-file="${evidence}/verified-shas.txt" \
            --reverted-in-candidate-file="${evidence}/reverted-in-candidate.txt" \
            --github-output="${GITHUB_OUTPUT}"

      - name: Record obsolete run as an intentional non-deployment
        if: ${{ steps.deployment_identity.outputs.eligible == 'false' }}
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deployment_identity.outputs.sha }}
          FRESHNESS_REASON: ${{ steps.deployment_identity.outputs.reason }}
        run: |
          # A skipped publication still ends green; the annotation keeps it visible.
          echo "::notice title=Production not published::${FRESHNESS_REASON}"
          {
            echo '### Production deployment skipped'
            echo
            echo "Candidate: \`${DEPLOY_SHA}\`"
            echo
            echo "${FRESHNESS_REASON}"
            echo
            echo 'No candidate-tree build, report script, or provider command was executed.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install dependencies
        if: ${{ steps.deployment_identity.outputs.eligible == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Verify canonical deployment repository
        if: ${{ steps.deployment_identity.outputs.eligible == 'true' }}
        run: pnpm guard:repo

      - name: Release verification gate
        id: release_check
        if: ${{ steps.deployment_identity.outputs.eligible == 'true' }}
        run: pnpm release:check

      - name: Confirm the verified commit is still on main before publication
        id: pre_publish_identity
        if: ${{ steps.deployment_identity.outputs.eligible == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
          DEPLOY_SHA: ${{ steps.deployment_identity.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          # Still ON main is the question here, not still THE TIP of main. A tip
          # test at this point cannot be satisfied in practice: the gate above
          # runs ~50 minutes while main merges every ~60-85, so publication was
          # skipped on almost every run and production fell further behind than
          # the commit being refused.
          if git merge-base --is-ancestor "${DEPLOY_SHA}" refs/remotes/origin/main; then
            checkout_on_main=true
          else
            checkout_on_main=false
          fi
          # ADR-360: a revert merged during the gate withholds the reverted tree.
          reverted_in_candidate="${RUNNER_TEMP}/reverted-at-publication.txt"
          node "${RUNNER_TEMP}/list-reverted-in-candidate.mjs" \
            --candidate="${DEPLOY_SHA}" --main=refs/remotes/origin/main \
            --output="${reverted_in_candidate}"
          node "${RUNNER_TEMP}/resolve-web-deploy-identity.mjs" \
            --event-name="${EVENT_NAME}" \
            --phase=publication \
            --checkout-sha="${DEPLOY_SHA}" \
            --current-main-sha="$(git rev-parse refs/remotes/origin/main)" \
            --validated-sha="${VALIDATED_SHA}" \
            --checkout-on-main="${checkout_on_main}" \
            --reverted-in-candidate-file="${reverted_in_candidate}" \
            --github-output="${GITHUB_OUTPUT}"

      - name: Record a commit that left main as a non-deployment
        if: ${{ steps.deployment_identity.outputs.eligible == 'true' && steps.pre_publish_identity.outputs.eligible == 'false' }}
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.deployment_identity.outputs.sha }}
          FRESHNESS_REASON: ${{ steps.pre_publish_identity.outputs.reason }}
        run: |
          echo "::notice title=Production not published::${FRESHNESS_REASON}"
          {
            echo '### Production deployment skipped after verification'
            echo
            echo "Candidate: \`${DEPLOY_SHA}\`"
            echo
            echo "${FRESHNESS_REASON}"
            echo
            echo 'The verified commit left main or main reverted it, so no provider command was executed.'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish to Cloudflare Pages
        id: publish
        if: ${{ steps.pre_publish_identity.outputs.eligible == 'true' }}
        # cloudflare/wrangler-action is the official Cloudflare action.
        # v4 installs Wrangler CLI v4 by default (matches this repo's
        # wrangler ^4.100.0); the apiToken/accountId/command inputs are
        # unchanged from v3. The `command` is the standard `wrangler pages
        # deploy` invocation; the action handles auth via the env vars.
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.PAGES_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.PAGES_CLOUDFLARE_ACCOUNT_ID }}
          # The 'laserforge' Pages project serves the canonical release URL
          # https://kerfdesk.com (Pages default fallback: laserforge-2fj.pages.dev).
          command: pages deploy dist/web --project-name=laserforge --branch=main

      - name: Record SHA-correlated readiness lanes
        if: ${{ always() && steps.deployment_identity.outputs.eligible == 'true' }}
        env:
          CI_STATE: ${{ steps.release_check.outcome }}
          DEPLOY_STATE: ${{ steps.publish.outcome }}
          DEPLOY_SHA: ${{ steps.deployment_identity.outputs.sha }}
          FRESHNESS_REASON: ${{ steps.pre_publish_identity.outputs.reason || steps.deployment_identity.outputs.reason }}
          TRIGGER_RUN_URL: ${{ github.event.workflow_run.html_url }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          pnpm report:release-readiness
          --sha=${DEPLOY_SHA}
          --state=ci=${CI_STATE}
          --state=browser=not-run
          --state=deploy=${DEPLOY_STATE}
          --state=packaged-runtime=not-run
          --state=perceptual-reference-cam=not-run
          --state=hardware=not-run
          "--evidence=ci=validated-run=${TRIGGER_RUN_URL}; release-check=${CI_STATE}; deploy-run=${WORKFLOW_RUN_URL}"
          "--evidence=deploy=publish=${DEPLOY_STATE}; freshness=${FRESHNESS_REASON}; run=${WORKFLOW_RUN_URL}"

      - name: Upload readiness report
        if: ${{ always() && steps.deployment_identity.outputs.eligible == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-readiness-deploy-${{ steps.deployment_identity.outputs.sha }}
          path: artifacts/release-readiness/
          retention-days: 30
