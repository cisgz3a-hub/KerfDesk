name: Prepare phone and MCP service checks
description: Use the isolated service runtime, frozen dependencies and test browser
runs:
  using: composite
  steps:
    - name: Set up the service runtime
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          pnpm-lock.yaml
          services/remote-control/pnpm-lock.yaml

    - name: Install isolated service dependencies
      shell: bash
      run: pnpm --dir services/remote-control install --frozen-lockfile --ignore-scripts

    - name: Install the service's test browser
      shell: bash
      # --with-deps fetches optional fonts from the Ubuntu archive. When the
      # runner cannot reach it (2026-11-11 DNS failures), install the browser
      # alone from Playwright's CDN; the runner image already has its libraries.
      run: |
        set +e
        pnpm --dir services/remote-control exec playwright install --with-deps chromium
        status=$?
        set -e
        if [ "$status" -ne 0 ]; then
          echo "::warning::playwright install --with-deps chromium failed; installing chromium without system packages"
          pnpm --dir services/remote-control exec playwright install chromium
        fi

    - name: Select the installed test browser
      shell: bash
      run: echo 'KERFDESK_TEST_BROWSER=chromium' >> "${GITHUB_ENV}"
