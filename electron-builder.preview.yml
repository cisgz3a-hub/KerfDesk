appId: dev.laserforge.app
productName: KerfDesk
copyright: Copyright © 2026 Johann Stolk
forceCodeSigning: false

directories:
  output: release/${version}
  buildResources: build

# Preview packages the same compiled application as web and stable desktop.
# Legal material is duplicated at the package root so it remains available
# outside the renderer bundle on every desktop target.
files:
  - dist-electron/**/*
  - '!dist-electron/**/*.map'
  - dist/web/**/*
  - package.json
extraResources:
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: public/third-party-notices.txt
    to: legal/third-party-notices.txt

extraMetadata:
  kerfdeskUpdateChannelTrusted: false
  kerfdeskDesktopReleaseChannel: preview

afterPack: scripts/electron-builder-preview-after-pack.mjs

win:
  icon: public/favicon.svg
  target:
    - target: nsis
      arch:
        - x64
  artifactName: KerfDesk-${version}-windows-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: KerfDesk
  license: public/eula.txt
  differentialPackage: false

# Double-clicking a KerfDesk project opens it in KerfDesk (ADR-378). Only the
# .lf2 type is claimed: registering .lbrn/.lbrn2 here would take LightBurn's
# own files away from LightBurn. Those still open through Open With, the
# command line (electron/desktop-project-paths.ts) and File > Open.
fileAssociations:
  - ext: lf2
    name: KerfDesk.Project
    description: KerfDesk project

mac:
  appId: com.kerfdesk.app
  icon: public/favicon.svg
  target:
    - dmg
  artifactName: KerfDesk-${version}-macos-${arch}.${ext}
  identity: null
  hardenedRuntime: false
  notarize: false
  minimumSystemVersion: '12.0'
  extendInfo:
    NSCameraUsageDescription: KerfDesk uses a camera to align work with material and preview the machine workspace.
    NSLocalNetworkUsageDescription: KerfDesk connects to cameras on the local network for workspace preview.

dmg:
  title: KerfDesk ${version}
  sign: false
  writeUpdateInfo: false
