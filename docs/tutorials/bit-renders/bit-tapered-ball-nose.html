<!doctype html>
<!--
  Source scene for the tapered ball-nose bit picture (ADR-368). Unlike the
  other bit pictures, this one is rendered from the modeled cutter law rather
  than generated: a ball tip tangent to a straight taper, with the geometry of
  Amana 46282 (1/16" ball tip, 5.4 degrees per side, 1" flutes, 1/4" shank).
  Helical flutes, the shank length, materials and lighting are illustrative.

  Reproduce: serve the repository root with any static file server, open this
  page in Chromium at a 1280 x 1280 viewport, wait for window.__rendered, take
  a screenshot, then encode it as generated-pictures.md describes.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tapered ball-nose bit render</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1280px;
        height: 1280px;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #eceef0 0%, #dfe1e4 55%, #d2d5d8 100%);
      }
      canvas {
        display: block;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js" } }
    </script>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';

      // Cutter geometry in mm. The per-side angle is the seller's listed value.
      const tipDiameter = 1.5875;
      const sideAngleDeg = 5.4;
      const fluteLength = 25.4;
      const shankDiameter = 6.35;
      const shankLength = 30;

      // The same law as src/core/cnc-tapered-ball.ts: a sphere of the tip
      // radius up to the tangent point, then a straight flank.
      const ballRadius = tipDiameter / 2;
      const halfAngle = (sideAngleDeg * Math.PI) / 180;
      const tangentRadius = ballRadius * Math.cos(halfAngle);
      const tangentHeight = ballRadius * (1 - Math.sin(halfAngle));
      const tanHalf = Math.tan(halfAngle);
      const topRadius = tangentRadius + (fluteLength - tangentHeight) * tanHalf;

      function profileRadius(z) {
        if (z <= 0) return 0;
        if (z <= tangentHeight) {
          return Math.sqrt(Math.max(0, ballRadius ** 2 - (ballRadius - z) ** 2));
        }
        return tangentRadius + (z - tangentHeight) * tanHalf;
      }

      function smoothstep(edge0, edge1, x) {
        const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
        return t * t * (3 - 2 * t);
      }

      // Three right-hand helical flutes (upcut in clockwise rotation): a steep
      // rake face behind each cutting edge, a gradual heel, then a plain land.
      // They fade out at the tip and run out below the shank.
      const flutes = 3;
      const leadMm = 30;
      const grooveShare = 0.46;
      function grooveProfile(phase) {
        if (phase >= grooveShare) return 0;
        return Math.sin(Math.PI * Math.pow(phase / grooveShare, 0.55));
      }
      function grooveFactor(theta, z) {
        const turns = (flutes * (theta + (2 * Math.PI * z) / leadMm)) / (2 * Math.PI);
        const phase = turns - Math.floor(turns);
        const depth =
          0.3 * smoothstep(0.1, 2.5, z) * (1 - smoothstep(fluteLength - 2.5, fluteLength + 0.5, z));
        return 1 - depth * grooveProfile(phase);
      }

      function fluteGeometry() {
        const thetaSegments = 240;
        const zSegments = 520;
        const zMax = fluteLength + 0.6;
        const positions = [];
        const indices = [];
        for (let i = 0; i <= zSegments; i += 1) {
          // Rows bunch toward the tip so the small ball stays round.
          const z = zMax * Math.pow(i / zSegments, 1.6);
          const base = z <= fluteLength ? profileRadius(z) : topRadius + (z - fluteLength) * 0.1;
          for (let j = 0; j <= thetaSegments; j += 1) {
            const theta = (j / thetaSegments) * Math.PI * 2;
            const r = base * grooveFactor(theta, z);
            positions.push(r * Math.cos(theta), z, r * Math.sin(theta));
          }
        }
        const row = thetaSegments + 1;
        for (let i = 0; i < zSegments; i += 1) {
          for (let j = 0; j < thetaSegments; j += 1) {
            const p = i * row + j;
            indices.push(p, p + row, p + 1, p + 1, p + row, p + row + 1);
          }
        }
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function shankGeometry() {
        const base = fluteLength + 0.6;
        const shankRadius = shankDiameter / 2;
        const points = [
          new THREE.Vector2(topRadius + 0.06, base - 0.2),
          new THREE.Vector2(shankRadius, base + 1.4),
          new THREE.Vector2(shankRadius, base + shankLength - 0.5),
          new THREE.Vector2(shankRadius - 0.5, base + shankLength),
          new THREE.Vector2(0, base + shankLength),
        ];
        return new THREE.LatheGeometry(points, 160);
      }

      // A light grey studio with two bright strips, an overhead softbox and two
      // black flags, so polished carbide shows banded highlights.
      function studioEnvironment() {
        const studio = new THREE.Scene();
        studio.add(
          new THREE.Mesh(
            new THREE.BoxGeometry(120, 120, 120),
            new THREE.MeshBasicMaterial({ color: 0x9a9ea4, side: THREE.BackSide }),
          ),
        );
        const panel = (w, h, x, y, z, level) => {
          const mesh = new THREE.Mesh(
            new THREE.PlaneGeometry(w, h),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(level, level, level),
              side: THREE.DoubleSide,
            }),
          );
          mesh.position.set(x, y, z);
          mesh.lookAt(0, 0, 0);
          studio.add(mesh);
        };
        panel(16, 100, -30, 5, 42, 3.6);
        panel(9, 100, 44, 5, 12, 2.4);
        panel(70, 30, 0, 56, 0, 1.8);
        panel(18, 100, 30, 0, 45, 0.015);
        panel(16, 100, -48, 0, -10, 0.03);
        panel(40, 60, 0, 0, -56, 0.5);
        return studio;
      }

      const size = 1280;
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(size, size);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.setClearColor(0x000000, 0);
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(
        studioEnvironment(),
        0.02,
      ).texture;

      const tool = new THREE.Group();
      tool.add(
        new THREE.Mesh(
          fluteGeometry(),
          new THREE.MeshPhysicalMaterial({ color: 0xc9cdd2, metalness: 1, roughness: 0.22 }),
        ),
      );
      tool.add(
        new THREE.Mesh(
          shankGeometry(),
          new THREE.MeshPhysicalMaterial({ color: 0xd6d9dd, metalness: 1, roughness: 0.14 }),
        ),
      );
      tool.position.y = -(fluteLength + 0.6 + shankLength) / 2;
      tool.rotation.y = 0.55;
      const holder = new THREE.Group();
      holder.add(tool);
      holder.rotation.x = 0.1;
      scene.add(holder);

      const key = new THREE.DirectionalLight(0xffffff, 0.6);
      key.position.set(-40, 60, 80);
      scene.add(key);
      const rim = new THREE.DirectionalLight(0xffffff, 0.4);
      rim.position.set(60, 20, -40);
      scene.add(rim);

      const camera = new THREE.PerspectiveCamera(18, 1, 1, 1000);
      camera.position.set(0, 9, 186);
      camera.lookAt(0, 0.5, 0);

      renderer.render(scene, camera);
      window.__rendered = true;
    </script>
  </body>
</html>
