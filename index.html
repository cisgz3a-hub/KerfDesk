<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#101113" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/startup-craft.webp"
      fetchpriority="high"
    />
    <title>KerfDesk — Laser and CNC Software</title>
    <!-- Search and link-preview metadata mirrors the public pages (public/pricing/).
         The runtime window title still comes from use-window-title.ts. -->
    <meta
      name="description"
      content="KerfDesk is laser and CNC software for GRBL machines, in a Free and a Pro edition. Design, assign operations, preview the toolpath and send the job from your browser or a desktop app."
    />
    <link rel="canonical" href="https://kerfdesk.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KerfDesk" />
    <meta property="og:title" content="KerfDesk — Laser and CNC Software" />
    <meta
      property="og:description"
      content="KerfDesk is laser and CNC software for GRBL machines, in a Free and a Pro edition. Design, assign operations, preview the toolpath and send the job from your browser or a desktop app."
    />
    <meta property="og:url" content="https://kerfdesk.com/" />
    <meta
      property="og:image"
      content="https://kerfdesk.com/privacy/assets/social-card.ed667b4921.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- The wordmark, credit and activity indicator paint before JS or artwork.
         main.tsx dismisses the screen when the workspace is ready (F-A1); the
         desktop app holds it briefly first (ADR-049 Amendment 1).
         Activity is indeterminate: no simulated percentage. A laser pulse runs
         edge to edge along the loading rail and lights the artwork it passes.
         It animates only transform and opacity, so it stays smooth while the
         main thread is busy loading the workspace.
         Inline CSS is allowed by the CSP; startup code stays in the bundle. -->
    <style>
      #app-splash {
        --app-splash-gutter: clamp(28px, 7.5vw, 144px);
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 56px var(--app-splash-gutter) 110px;
        overflow: hidden;
        isolation: isolate;
        background: #101113;
        color: #f6f1e9;
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }
      #app-splash .app-splash__art {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 64% center;
      }
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, rgb(13 15 18 / 92%) 0%, rgb(13 15 18 / 66%) 34%, transparent 72%),
          linear-gradient(0deg, rgb(13 15 18 / 90%), transparent 30%);
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
      }
      #app-splash .app-splash__content {
        width: min(660px, 100%);
      }
      #app-splash .app-splash__eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 24px;
        color: #d0b390;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.4px;
        line-height: 1.6;
      }
      #app-splash .app-splash__eyebrow::before {
        content: '';
        width: 30px;
        height: 1px;
        flex: 0 0 auto;
        background: #c99a63;
      }
      #app-splash .app-splash__name {
        margin: 0;
        color: #f6f1e9;
        font-size: clamp(58px, 8.2vw, 126px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1.08;
      }
      #app-splash .app-splash__name span {
        color: #d6b48a;
        font-weight: 300;
      }
      #app-splash .app-splash__tagline {
        margin: 24px 0 0;
        color: #c7c1b8;
        font-size: clamp(15px, 1.5vw, 19px);
        font-weight: 400;
        letter-spacing: 0.2px;
        line-height: 1.6;
      }
      #app-splash .app-splash__loading {
        width: min(244px, 100%);
        margin-top: 54px;
      }
      /* The rail runs edge to edge, starting at the viewport's left edge. */
      #app-splash .app-splash__track {
        position: relative;
        width: 100vw;
        height: 2px;
        margin-left: calc(-1 * var(--app-splash-gutter));
        background: linear-gradient(
          90deg,
          transparent,
          rgb(214 173 123 / 30%) 12%,
          rgb(214 173 123 / 18%) 62%,
          transparent
        );
      }
      /* The beam is a zero-size point at the pulse head; its tail, flare and
         sparks hang off it. The glow rides the same keyframes in step. */
      #app-splash .app-splash__beam,
      #app-splash .app-splash__glow {
        position: absolute;
        transform: translateX(-6vw);
        animation: app-splash-pulse 1900ms cubic-bezier(0.45, 0, 0.8, 0.6) -300ms infinite;
      }
      #app-splash .app-splash__beam {
        top: 1px;
        left: 0;
      }
      #app-splash .app-splash__beam::before {
        content: '';
        position: absolute;
        top: -14px;
        right: 0;
        width: 44vw;
        height: 28px;
        background:
          linear-gradient(90deg, transparent, rgb(226 176 118 / 70%) 72%, #fff3e2) center / 100% 2px
            no-repeat,
          radial-gradient(
            ellipse 100% 50% at 100% 50%,
            rgb(255 190 120 / 42%),
            rgb(220 150 86 / 12%) 55%,
            transparent
          );
      }
      #app-splash .app-splash__beam::after {
        content: '';
        position: absolute;
        top: -60px;
        left: -340px;
        width: 680px;
        height: 120px;
        background:
          radial-gradient(
            circle 56px,
            #fff 0,
            #fff 2px,
            rgb(255 238 214 / 95%) 4px,
            rgb(255 196 128 / 62%) 9px,
            rgb(236 158 88 / 22%) 24px,
            transparent
          ),
          radial-gradient(
            340px 2.5px,
            rgb(255 240 222 / 95%),
            rgb(255 196 128 / 40%) 35%,
            transparent
          ),
          radial-gradient(150px 9px, rgb(255 214 166 / 40%), transparent),
          radial-gradient(1.5px 54px, rgb(255 236 210 / 70%), transparent),
          radial-gradient(110px 60px, rgb(240 160 90 / 16%), transparent);
        animation: app-splash-flicker 90ms steps(2, jump-none) infinite alternate;
      }
      /* Sparks fly off the head and fall away behind it. */
      #app-splash .app-splash__beam i {
        position: absolute;
        top: -1.5px;
        left: -1.5px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #fff1dc;
        box-shadow: 0 0 6px 2px rgb(255 166 84 / 85%);
        opacity: 0;
        animation: app-splash-spark 420ms linear infinite;
      }
      #app-splash .app-splash__beam i:nth-child(2) {
        --app-splash-spark-x: -22vw;
        --app-splash-spark-y: 34px;
        animation-duration: 520ms;
        animation-delay: -130ms;
      }
      #app-splash .app-splash__beam i:nth-child(3) {
        --app-splash-spark-x: -15vw;
        --app-splash-spark-y: -18px;
        animation-duration: 380ms;
        animation-delay: -260ms;
      }
      #app-splash .app-splash__beam i:nth-child(4) {
        --app-splash-spark-x: -30vw;
        --app-splash-spark-y: 46px;
        animation-duration: 610ms;
        animation-delay: -330ms;
      }
      #app-splash .app-splash__beam i:nth-child(5) {
        --app-splash-spark-x: -12vw;
        --app-splash-spark-y: 22px;
        animation-duration: 340ms;
        animation-delay: -60ms;
      }
      /* A pool of light centred on the head lifts the artwork and text it passes. */
      #app-splash .app-splash__glow {
        top: calc(1px - 60vh);
        left: -50vw;
        width: 70vw;
        height: 120vh;
        background:
          radial-gradient(
            18vw 30vh at 71.43% 50%,
            rgb(255 210 156 / 38%),
            rgb(255 176 104 / 12%) 48%,
            transparent
          ),
          radial-gradient(34vw 48vh at 50% 50%, rgb(255 186 116 / 13%), transparent);
        mix-blend-mode: screen;
      }
      #app-splash .app-splash__status {
        margin: 16px 0 0;
        color: #bfb8ae;
        font-size: 12px;
        letter-spacing: 0.4px;
        line-height: 1.6;
      }
      #app-splash .app-splash__about {
        margin-top: 28px;
        color: #c7c1b8;
        font-size: 14px;
        line-height: 1.6;
        pointer-events: auto;
      }
      #app-splash .app-splash__about a {
        color: #e6d2b8;
      }
      #app-splash .app-splash__footer {
        position: absolute;
        right: var(--app-splash-gutter);
        bottom: max(32px, env(safe-area-inset-bottom));
        left: var(--app-splash-gutter);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }
      #app-splash .app-splash__credit {
        margin: 0;
        color: #bfb8ae;
        font-size: 11px;
        line-height: 1.6;
      }
      #app-splash .app-splash__credit span {
        display: block;
        margin-top: 5px;
        color: #e6d2b8;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 20px;
        font-style: italic;
        letter-spacing: 0.1px;
      }
      #app-splash .app-splash__signature {
        margin: 0 0 3px;
        color: #bfb8ae;
        font-size: 10px;
        letter-spacing: 2px;
        line-height: 1.6;
      }
      /* Head positions are in viewport units, so the beam and the glow stay in
         step. The head launches from the left edge and accelerates across;
         the tail clears the right edge before the next pulse. */
      @keyframes app-splash-pulse {
        0% {
          transform: translateX(-6vw);
        }
        79%,
        100% {
          transform: translateX(150vw);
        }
      }
      @keyframes app-splash-flicker {
        from {
          opacity: 0.82;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes app-splash-spark {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(1.2);
        }
        40% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate(var(--app-splash-spark-x, -18vw), var(--app-splash-spark-y, 28px))
            scale(0.4);
        }
      }
      @media (max-width: 600px) {
        #app-splash {
          padding-bottom: 130px;
        }
        #app-splash .app-splash__art {
          object-position: 58% center;
        }
        #app-splash::before {
          background: linear-gradient(90deg, rgb(13 15 18 / 88%), rgb(13 15 18 / 38%));
        }
        #app-splash .app-splash__name {
          font-size: clamp(54px, 12vw, 72px);
        }
        #app-splash .app-splash__signature {
          display: none;
        }
      }
      @media (max-height: 480px) {
        #app-splash {
          padding-top: 24px;
          padding-bottom: 88px;
        }
        #app-splash .app-splash__eyebrow {
          margin-bottom: 12px;
        }
        #app-splash .app-splash__name {
          font-size: 54px;
        }
        #app-splash .app-splash__tagline {
          margin-top: 12px;
        }
        #app-splash .app-splash__loading {
          margin-top: 24px;
        }
        #app-splash .app-splash__footer {
          bottom: 20px;
        }
        #app-splash .app-splash__credit span {
          font-size: 17px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
        #app-splash .app-splash__beam,
        #app-splash .app-splash__glow {
          display: none;
        }
      }
      @media (forced-colors: active) {
        #app-splash {
          background: Canvas;
        }
        #app-splash::before,
        #app-splash .app-splash__art {
          display: none;
        }
        #app-splash .app-splash__track {
          background: GrayText;
        }
        #app-splash .app-splash__glow,
        #app-splash .app-splash__beam::after,
        #app-splash .app-splash__beam i {
          display: none;
        }
        #app-splash .app-splash__beam::before {
          top: -1px;
          height: 2px;
          background: Highlight;
        }
      }
    </style>
    <!-- Web CSP is supplied by public/_headers; Electron supplies its own.
         Neither surface permits inline scripts. -->
  </head>
  <body>
    <div id="app-root"></div>
    <div id="app-splash" role="status" aria-label="Loading KerfDesk workspace">
      <img
        class="app-splash__art"
        src="/startup-craft.webp"
        alt=""
        fetchpriority="high"
        decoding="async"
      />
      <div class="app-splash__content">
        <p class="app-splash__eyebrow">LASER &amp; CNC SOFTWARE</p>
        <h1 class="app-splash__name">Kerf<span>Desk</span></h1>
        <p class="app-splash__tagline">Your ideas. Beautifully made.</p>
        <div class="app-splash__loading">
          <div class="app-splash__track" aria-hidden="true">
            <span class="app-splash__glow"></span>
            <span class="app-splash__beam"><i></i><i></i><i></i><i></i><i></i></span>
          </div>
          <p class="app-splash__status">Opening your workspace…</p>
        </div>
        <!-- Crawlers and script-free visitors read this summary instead of only
             the loading line; with scripts on it never renders. -->
        <noscript>
          <div class="app-splash__about">
            <p>
              KerfDesk is laser and CNC software for GRBL machines, in a Free and a Pro edition.
              Design artwork, assign cut, fill, image and CNC operations, preview the toolpath and
              send the job from your browser or the desktop app.
            </p>
            <p>
              The workspace needs JavaScript. You can still
              <a href="/download">download the desktop app</a>, see
              <a href="/pricing/">pricing</a> or get <a href="/support">support</a>.
            </p>
          </div>
        </noscript>
      </div>
      <div class="app-splash__footer">
        <p class="app-splash__credit">Created by <span>Ons Houtkombuis</span></p>
        <p class="app-splash__signature" aria-hidden="true">DESIGN / ENGRAVE / CARVE</p>
      </div>
    </div>
    <script type="module" src="/src/ui/app/browser-entry.ts"></script>
  </body>
</html>
