    <!-- Vite embeds the artwork so timber, wordmark and credit paint together
         before workspace JS. Synchronous image decoding avoids a black frame.
         main.tsx dismisses the screen when the workspace is ready (F-A1); the
         screen holds for four visible seconds on the first launch of each app
         version in both editions (ADR-049 Amendments 2 and 3).
         Activity is indeterminate: no simulated percentage. Soft light flows
         along the artwork's wood grooves: the grooves were traced from
         startup-craft.webp into the SVG below, in that image's pixels, so
         retrace them if the artwork changes. Keep the grooves about 8 px
         inside the wood's silhouette and the eye opening: the 16 px soft
         stroke otherwise lights the background beside the wood. The lights
         animate only transform and opacity, so the flow stays smooth while the
         workspace loads.
         Inline CSS is allowed by the CSP; startup code stays in the bundle. -->
    <style>
      /* Keep even the topmost live machine controls below the startup screen.
         Release this stacking boundary with startup input so body portals cannot
         cover those controls once the workspace is ready. */
      #app-root[inert] {
        isolation: isolate;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 56px clamp(28px, 7.5vw, 144px) 110px;
        overflow: hidden;
        isolation: isolate;
        background: #101113;
        color: #f6f1e9;
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
        pointer-events: auto;
        /* The final inline rule reveals this only after the complete artwork
           token and branding have arrived, including streamed HTML. */
        visibility: hidden;
        transition: opacity 750ms ease-out;
      }
      #app-splash .app-splash__art {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 64% center;
      }
      /* The flow frame fills the same box as the artwork. Inside it, the grain
         box repeats the artwork's object-fit cover (1672x941, 64% across), so
         the traced grooves land on the real ones. Lights pass over black, the
         grooves multiply them, and the frame adds the result onto the art. It
         sits above the shading so the grooves glow out of it, below the text. */
      #app-splash .app-splash__flow {
        position: absolute;
        inset: 0;
        z-index: -1;
        container-type: size;
        /* Screen where the additive plus-lighter is not supported. */
        mix-blend-mode: screen;
        mix-blend-mode: plus-lighter;
      }
      #app-splash .app-splash__grain {
        position: absolute;
        top: calc((100cqh - max(100cqh, 56.28cqw)) / 2);
        left: calc((100cqw - max(100cqw, 177.683cqh)) * 0.64);
        width: max(100cqw, 177.683cqh);
        height: max(100cqh, 56.28cqw);
        /* Chromium needs this group for the grooves to multiply the lights. */
        isolation: isolate;
        background: #000;
      }
      #app-splash .app-splash__flow i {
        position: absolute;
        top: 0;
        left: 0;
        width: 13%;
        aspect-ratio: 1;
        margin: -6.5% 0 0 -6.5%;
        border-radius: 50%;
        background: radial-gradient(
          closest-side,
          #fff4e2,
          rgb(255 204 136 / 90%) 26%,
          rgb(255 164 92 / 42%) 58%,
          transparent
        );
        opacity: 0;
        animation: app-splash-flow-1 7000ms linear infinite;
      }
      #app-splash .app-splash__flow i:nth-child(1) {
        animation-name: app-splash-flow-1;
        animation-delay: -6000ms;
      }
      #app-splash .app-splash__flow i:nth-child(2) {
        animation-name: app-splash-flow-2;
        animation-delay: -4600ms;
      }
      #app-splash .app-splash__flow i:nth-child(3) {
        animation-name: app-splash-flow-3;
        animation-delay: -3200ms;
      }
      #app-splash .app-splash__flow i:nth-child(4) {
        animation-name: app-splash-flow-4;
        animation-delay: -1800ms;
      }
      #app-splash .app-splash__flow i:nth-child(5) {
        animation-name: app-splash-flow-5;
        animation-delay: -400ms;
      }
      #app-splash .app-splash__grooves {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: multiply;
      }
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, rgb(13 15 18 / 92%) 0%, rgb(13 15 18 / 66%) 34%, transparent 72%),
          linear-gradient(0deg, rgb(13 15 18 / 90%), transparent 30%);
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
      }
      #app-splash .app-splash__content {
        width: min(660px, 100%);
      }

        gap: 14px;

      }
      #app-splash .app-splash__name {
        margin: 0;

        font-weight: 500;
