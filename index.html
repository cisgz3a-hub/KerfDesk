<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/startup-craft.webp"
      fetchpriority="high"
    />
    <title>KerfDesk</title>
    <!-- The wordmark, credit and activity indicator paint before JS or artwork.
         main.tsx dismisses the screen when the workspace is ready (F-A1).
         Activity is indeterminate: no simulated percentage or branding hold.
         Inline CSS is allowed by the CSP; startup code stays in the bundle. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        box-sizing: border-box;
        padding: 56px clamp(28px, 7.5vw, 144px) 110px;
        overflow: hidden;
        isolation: isolate;
        background: #101113;
        color: #f6f1e9;
        color-scheme: dark;
        font-family: 'Segoe UI', system-ui, sans-serif;
        pointer-events: none;
        transition: opacity 180ms ease-out;
      }
      #app-splash .app-splash__art {
        position: absolute;
        inset: 0;
        z-index: -3;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 64% center;
      }
      #app-splash::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -2;
        background:
          linear-gradient(90deg, rgb(13 15 18 / 92%) 0%, rgb(13 15 18 / 66%) 34%, transparent 72%),
          linear-gradient(0deg, rgb(13 15 18 / 90%), transparent 30%);
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
      }
      #app-splash .app-splash__content {
        width: min(660px, 100%);
      }
      #app-splash .app-splash__eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 24px;
        color: #d0b390;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 2.4px;
        line-height: 1.6;
      }
      #app-splash .app-splash__eyebrow::before {
        content: '';
        width: 30px;
        height: 1px;
        flex: 0 0 auto;
        background: #c99a63;
      }
      #app-splash .app-splash__name {
        margin: 0;
        color: #f6f1e9;
        font-size: clamp(58px, 8.2vw, 126px);
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1.08;
      }
      #app-splash .app-splash__name span {
        color: #d6b48a;
        font-weight: 300;
      }
      #app-splash .app-splash__tagline {
        margin: 24px 0 0;
        color: #c7c1b8;
        font-size: clamp(15px, 1.5vw, 19px);
        font-weight: 400;
        letter-spacing: 0.2px;
        line-height: 1.6;
      }
      #app-splash .app-splash__loading {
        width: min(244px, 100%);
        margin-top: 54px;
      }
      #app-splash .app-splash__track {
        height: 2px;
        overflow: hidden;
        background: #4b4540;
      }
      #app-splash .app-splash__beam {
        display: block;
        width: 32%;
        height: 100%;
        background: #d6ad7b;
        transform: translateX(106%);
        animation: app-splash-loading 1500ms ease-in-out infinite;
      }
      #app-splash .app-splash__status {
        margin: 16px 0 0;
        color: #bfb8ae;
        font-size: 12px;
        letter-spacing: 0.4px;
        line-height: 1.6;
      }
      #app-splash .app-splash__footer {
        position: absolute;
        right: clamp(28px, 7.5vw, 144px);
        bottom: max(32px, env(safe-area-inset-bottom));
        left: clamp(28px, 7.5vw, 144px);
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }
      #app-splash .app-splash__credit {
        margin: 0;
        color: #bfb8ae;
        font-size: 11px;
        line-height: 1.6;
      }
      #app-splash .app-splash__credit span {
        display: block;
        margin-top: 5px;
        color: #e6d2b8;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 20px;
        font-style: italic;
        letter-spacing: 0.1px;
      }
      #app-splash .app-splash__signature {
        margin: 0 0 3px;
        color: #bfb8ae;
        font-size: 10px;
        letter-spacing: 2px;
        line-height: 1.6;
      }
      @keyframes app-splash-loading {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(320%);
        }
      }
      @media (max-width: 600px) {
        #app-splash {
          padding-bottom: 130px;
        }
        #app-splash .app-splash__art {
          object-position: 58% center;
        }
        #app-splash::before {
          background: linear-gradient(90deg, rgb(13 15 18 / 88%), rgb(13 15 18 / 38%));
        }
        #app-splash .app-splash__name {
          font-size: clamp(54px, 12vw, 72px);
        }
        #app-splash .app-splash__signature {
          display: none;
        }
      }
      @media (max-height: 480px) {
        #app-splash {
          padding-top: 24px;
          padding-bottom: 88px;
        }
        #app-splash .app-splash__eyebrow {
          margin-bottom: 12px;
        }
        #app-splash .app-splash__name {
          font-size: 54px;
        }
        #app-splash .app-splash__tagline {
          margin-top: 12px;
        }
        #app-splash .app-splash__loading {
          margin-top: 24px;
        }
        #app-splash .app-splash__footer {
          bottom: 20px;
        }
        #app-splash .app-splash__credit span {
          font-size: 17px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash {
          transition: none;
        }
        #app-splash .app-splash__beam {
          animation: none;
        }
      }
      @media (forced-colors: active) {
        #app-splash {
          background: Canvas;
        }
        #app-splash::before,
        #app-splash .app-splash__art {
          display: none;
        }
        #app-splash .app-splash__track {
          background: GrayText;
        }
        #app-splash .app-splash__beam {
          background: Highlight;
        }
      }
    </style>
    <!-- Web CSP is supplied by public/_headers; Electron supplies its own.
         Neither surface permits inline scripts. -->
  </head>
  <body>
    <div id="app-root"></div>
    <div id="app-splash" role="status" aria-label="Loading KerfDesk workspace">
      <img
        class="app-splash__art"
        src="/startup-craft.webp"
        alt=""
        fetchpriority="high"
        decoding="async"
      />
      <div class="app-splash__content">
        <p class="app-splash__eyebrow">LASER &amp; CNC SOFTWARE</p>
        <h1 class="app-splash__name">Kerf<span>Desk</span></h1>
        <p class="app-splash__tagline">Your ideas. Beautifully made.</p>
        <div class="app-splash__loading">
          <div class="app-splash__track" aria-hidden="true">
            <span class="app-splash__beam"></span>
          </div>
          <p class="app-splash__status">Opening your workspace…</p>
        </div>
      </div>
      <div class="app-splash__footer">
        <p class="app-splash__credit">Created by <span>Ons Houtkombuis</span></p>
        <p class="app-splash__signature" aria-hidden="true">DESIGN / ENGRAVE / CARVE</p>
      </div>
    </div>
    <script type="module" src="/src/ui/app/main.tsx"></script>
  </body>
</html>
