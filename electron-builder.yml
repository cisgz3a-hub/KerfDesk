appId: dev.laserforge.app
productName: KerfDesk
copyright: Copyright © 2026 Johann Stolk
afterPack: scripts/verify-desktop-renderer.mjs

directories:
  output: release/${version}
  buildResources: build

# Only ship what's needed at runtime: the compiled Electron main + the Vite
# web bundle. node_modules pruning is handled by electron-builder using the
# production dependency tree.
files:
  - dist-electron/**/*
  - '!dist-electron/**/*.map'
  - dist/web/**/*
  - package.json
  - public/desktop-release-manifest.mjs
  - public/desktop-manual-download.mjs
  - public/desktop-platform-download.mjs
  - public/desktop-update-notes.mjs
  - public/desktop-commercial-catalog.mjs
  - public/desktop-release-keys.json
  - public/desktop-sandbox-contract.mjs
  - public/licence-key-text.mjs
  - public/desktop-licence-window.mjs
  # The renderer is bundled into dist/web. Ship only the main process's
  # reachable packages and mandatory dependency closure (ADR-483), including
  # nested imports. electron/packaged-runtime-closure.test.ts checks this list
  # against the installed graph; optional ws accelerators remain excluded.
  - '!**/node_modules/**/*'
  - '**/node_modules/{electron-updater,builder-util-runtime,debug,ms,sax,fs-extra,graceful-fs,jsonfile,universalify,js-yaml,argparse,lazy-val,lodash.escaperegexp,lodash.isequal,semver,tiny-typed-emitter,ws,zod}/**/*'

extraResources:
  - from: LICENSE
    to: legal/LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: legal/THIRD_PARTY_NOTICES.md
  - from: public/third-party-notices.txt
    to: legal/third-party-notices.txt

# Electron fuses, flipped in the packaged binary before signing (ADR-483).
# KerfDesk never runs its executable as plain Node, reads NODE_OPTIONS, takes
# --inspect, or loads anything outside app.asar, so each of those stays off;
# app.asar's header hash is checked at launch (electron-builder writes the
# hash into the executable). Nothing is served from file://.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

win:
  icon: public/app-icon.ico
  # electron-updater verifies downloaded NSIS updates against the publisher
  # identity from the installed signed build. Keep this explicit in config.
  verifyUpdateCodeSignature: true
  # Stable tags sign with the SSL.com eSigner certificate that the release
  # workflow loads into the Windows certificate store and names by thumbprint
  # (ADR-142 Amendment 1). SHA-256 only: every signature counts against the
  # eSigner plan, and a SHA-1 signature adds nothing on supported Windows.
  # Builds with no certificate (dry run, package check) skip signing.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://ts.ssl.com
  target:
    - target: nsis
      arch:
        - x64
  artifactName: KerfDesk-${version}-windows-${arch}-setup.${ext}

nsis:
  include: scripts/nsis-file-associations.nsh
  installerIcon: public/app-icon.ico
  uninstallerIcon: public/app-icon.ico
  installerHeaderIcon: public/app-icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: KerfDesk
  # NSIS displays the License & Safety Notice before installation: the free
  # use terms and safety warnings (ADR-543). It sets no commercial terms.
  license: build/installer-terms.txt

# Double-clicking a KerfDesk project opens it in KerfDesk (ADR-378). Only the
# .lf2 type is claimed: registering .lbrn/.lbrn2 here would take LightBurn's
# own files away from LightBurn. Those still open through Open With, the
# command line (electron/desktop-project-paths.ts) and File > Open.
fileAssociations:
  - ext: lf2
    name: KerfDesk.Project
    description: KerfDesk project
    # Linux only: the shared-mime-info type the desktop entry opens (ADR-607).
    mimeType: application/x-kerfdesk-project

# Linux desktop (ADR-607): an AppImage that runs on most distributions without
# installing, and a .deb for Debian and Ubuntu, both x64. electron-builder's
# .deb scripts set up the Chromium sandbox and, on Ubuntu 24.04 and newer, the
# AppArmor profile it needs. The desktop entry claims the .lf2 MIME type so a
# double-clicked project opens in KerfDesk, and desktopName in package.json
# keeps the running window grouped with that entry.
linux:
  executableName: kerfdesk
  icon: public/app-icon-512x512.png
  category: Graphics
  synopsis: CAM for GRBL laser cutters, engravers and CNC routers
  description: KerfDesk prepares artwork, previews toolpaths, writes G-code and runs GRBL laser cutters, engravers and CNC routers.
  maintainer: Johann Stolk <support@kerfdesk.com>
  vendor: Johann Stolk
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  artifactName: KerfDesk-${version}-linux-${arch}.${ext}
  # No Linux update feed exists yet: write no updater metadata (latest-linux.yml,
  # app-update.yml), and never inherit the Windows feed below.
  publish: null

deb:
  packageName: kerfdesk
  packageCategory: graphics
  priority: optional

# electron-builder's AppImage desktop entry always adds --no-sandbox. Leave it
# out: its AppRun already drops Chromium's sandbox only where the system blocks
# the user namespaces it needs (Ubuntu 24.04 and newer), and keeps it elsewhere.
appImage:
  executableArgs: []

# The static AppImage runtime (electron-builder 26.16.1 lists it as a beta toolset)
# carries its own FUSE support, so the AppImage starts on Ubuntu 22.04 and newer
# without libfuse2, which those systems no longer install. The default legacy
# runtime needs libfuse2 and fails before KerfDesk starts (ADR-607). The runtime
# and the libraries this toolset copies into usr/lib are listed, with their
# licences, in docs/licensing/appimage-runtime-notices.txt (ADR-017 Amendment 1):
# a toolset change means checking that list again.
toolsets:
  appimage: 1.0.3

# The toolset's lib/x64 also holds GPL-3.0 libraries (libappindicator3,
# libindicator3) and GConf, which KerfDesk does not use. This hook gives
# electron-builder a copy of the toolset without them (ADR-017 Amendment 2).
artifactBuildStarted: scripts/appimage-toolset.mjs

# This stable config has no macOS target: the Mac builds are the unsigned
# Preview (electron-builder.preview.yml, ADR-248) until a Developer ID and
# notarization exist. The Linux block above packages the same app (ADR-607).

# Self-hosted generic update feed on Cloudflare R2 (ADR-024). Configuring a
# `publish` block makes electron-builder emit `latest.yml` + `.blockmap`;
# electron-updater reads `latest.yml` from this URL. The CI release job uploads
# those files plus the `.exe` to the bucket behind this origin. The URL is
# pinned here at build time — never arbitrary (PROJECT.md security posture).
publish:
  provider: generic
  url: https://dl.kerfdesk.com/desktop
