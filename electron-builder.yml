appId: dev.laserforge.app
productName: KerfDesk
copyright: Copyright © 2026 Johann Stolk

directories:
  output: release/${version}
  buildResources: build

# Only ship what's needed at runtime: the compiled Electron main + the Vite
# web bundle. node_modules pruning is handled by electron-builder using the
# production dependency tree.
files:
  - dist-electron/**/*
  - '!dist-electron/**/*.map'
  - dist/web/**/*
  - package.json
  # The renderer is bundled into dist/web, so the main process needs only
  # electron-updater at runtime. Ship its dependency closure and no other
  # node_modules (ADR-483): the renderer-only packages were 88.6 MB of the
  # 110 MB app.asar. This also keeps pdfjs-dist's old GPL font assets and any
  # native canvas binary out. electron/packaged-runtime-closure.test.ts keeps
  # this list equal to electron-updater's installed dependency tree.
  - '!**/node_modules/**/*'
  - '**/node_modules/{electron-updater,builder-util-runtime,debug,ms,sax,fs-extra,graceful-fs,jsonfile,universalify,js-yaml,argparse,lazy-val,lodash.escaperegexp,lodash.isequal,semver,tiny-typed-emitter}/**/*'

# Electron fuses, flipped in the packaged binary before signing (ADR-483).
# KerfDesk never runs its executable as plain Node, reads NODE_OPTIONS, takes
# --inspect, or loads anything outside app.asar, so each of those stays off;
# app.asar's header hash is checked at launch (electron-builder writes the
# hash into the executable). Nothing is served from file://.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

win:
  icon: public/favicon.svg
  # electron-updater verifies downloaded NSIS updates against the publisher
  # identity from the installed signed build. Keep this explicit in config.
  verifyUpdateCodeSignature: true
  target:
    - target: nsis
      arch:
        - x64
  artifactName: KerfDesk-${version}-windows-${arch}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: KerfDesk
  # NSIS displays the MIT License & Safety Notice before installation; this
  # adds no restriction and does not authorize future commercial terms.
  license: public/eula.txt

# Double-clicking a KerfDesk project opens it in KerfDesk (ADR-378). Only the
# .lf2 type is claimed: registering .lbrn/.lbrn2 here would take LightBurn's
# own files away from LightBurn. Those still open through Open With, the
# command line (electron/desktop-project-paths.ts) and File > Open.
fileAssociations:
  - ext: lf2
    name: KerfDesk.Project
    description: KerfDesk project

# This stable Windows config keeps macOS / Linux targets absent. ADR-248 governs
# the future Mac Preview config/workflow; Linux remains out of scope.
# mac:
#   target: dmg
# linux:
#   target: AppImage

# Self-hosted generic update feed on Cloudflare R2 (ADR-024). Configuring a
# `publish` block makes electron-builder emit `latest.yml` + `.blockmap`;
# electron-updater reads `latest.yml` from this URL. The CI release job uploads
# those files plus the `.exe` to the bucket behind this origin. The URL is
# pinned here at build time — never arbitrary (PROJECT.md security posture).
publish:
  provider: generic
  url: https://dl.kerfdesk.com/desktop
